apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
  namespace: laravel-spa
spec:
  schedule: "0 4 * * *"
  # Central Time, same as yard-sales-prune-ended — offset an hour later
  # (4am vs 3am) so the two scheduled jobs don't compete for resources.
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          # Lets both containers' non-root users (999 for the mysql
          # image, 82/www-data for the app image) write to and read
          # from the shared emptyDir below.
          securityContext:
            fsGroup: 999
          volumes:
            - name: dump
              emptyDir: {}
          # The dump and the upload are deliberately two different
          # images: the app image runs as a non-root user and can't
          # install mysqldump at run time, so an official MySQL image
          # (which already has it) does the dump into a shared volume,
          # then the app image uploads that file to MinIO — see
          # App\Console\Commands\BackupDatabase.
          initContainers:
            - name: dump
              image: mysql:8.0
              envFrom:
                - secretRef:
                    name: laravel-spa-secrets
              command:
                - sh
                - -c
                - >
                  mysqldump --single-transaction --quick --no-tablespaces
                  --host="$DB_HOST" --port="$DB_PORT"
                  --user="$DB_USERNAME" --password="$DB_PASSWORD"
                  "$DB_DATABASE" | gzip > /dump/backup.sql.gz
              volumeMounts:
                - name: dump
                  mountPath: /dump
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              # No requests, no limits -- by policy.
              #
              # A request RESERVES capacity whether or not it is used, and the
              # scheduler places pods on reservations rather than reality. That is
              # what made this cluster look 79% full while it was 35% used, so
              # nothing could be placed and "least loaded node" was decided from
              # fiction. A limit is a ceiling that has to be guessed in advance,
              # and every guess made here was wrong for the next traffic shape --
              # it OOMKilled the ingress twice.
              #
              # So: nothing is reserved and nothing is capped. Every pod may take
              # whatever the node has free, and scaling decisions belong to
              # Kubernetes (see the HorizontalPodAutoscalers) rather than to
              # hand-picked numbers.
              #
              # The accepted trade-off: with no requests every pod is BestEffort
              # QoS, so under genuine node memory pressure the kubelet evicts
              # these first and the kernel may OOM-kill them. That is deliberate.
          containers:
            - name: upload
              image: ghcr.io/123xtd/laravel-spa-app:latest
              command: ["php", "artisan", "backup:upload", "/dump/backup.sql.gz"]
              workingDir: /var/www/html
              envFrom:
                - secretRef:
                    name: laravel-spa-secrets
              volumeMounts:
                - name: dump
                  mountPath: /dump
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 82
                runAsGroup: 82
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              # No requests, no limits -- by policy.
              #
              # A request RESERVES capacity whether or not it is used, and the
              # scheduler places pods on reservations rather than reality. That is
              # what made this cluster look 79% full while it was 35% used, so
              # nothing could be placed and "least loaded node" was decided from
              # fiction. A limit is a ceiling that has to be guessed in advance,
              # and every guess made here was wrong for the next traffic shape --
              # it OOMKilled the ingress twice.
              #
              # So: nothing is reserved and nothing is capped. Every pod may take
              # whatever the node has free, and scaling decisions belong to
              # Kubernetes (see the HorizontalPodAutoscalers) rather than to
              # hand-picked numbers.
              #
              # The accepted trade-off: with no requests every pod is BestEffort
              # QoS, so under genuine node memory pressure the kubelet evicts
              # these first and the kernel may OOM-kill them. That is deliberate.