# Journey-based load test: a simulated population rather than a crowd of
# identical loops.
#
# WHY THIS REPLACES k6-lb-job.yaml FOR CAPACITY WORK
#
# Every run before this used `ramping-vus`: N concurrent loops, each
# hitting / -> /listings -> /listings/{id} with a 1-3s pause, forever.
# That found five real bottlenecks, so it earned its keep. But as a model
# of traffic it is brute force:
#
#  - It fixes CONCURRENCY, not arrival rate. 16,000 VUs means 16,000
#    sessions in flight at all times. Sixteen thousand real visitors over
#    an hour are never all mid-request; peak concurrency is a small
#    fraction of the user count. The 16,000-VU run almost certainly
#    corresponds to several times that many real users.
#  - Every simulated user behaved identically. Nobody posted an ad, saved
#    a listing, contacted a seller or posted a yard sale -- which are the
#    expensive operations (writes, uploads, recaptcha) and were therefore
#    completely untested.
#  - Costs came out as one aggregate, so there was no way to see what
#    posting an ad costs versus loading the home page, and therefore no
#    way to know what to optimise next.
#
# This script fixes all three. `ramping-arrival-rate` sets arrivals per
# second and lets k6 allocate VUs to sustain them, so concurrency becomes
# an OUTPUT (how many sessions are stuck because the server is slow)
# rather than a fixed input. Saturation shows up as dropped iterations
# instead of silently reduced throughput -- which is what hid the
# collapse in the 16,000-VU run, where 4x the load produced half the work.
#
# Measured single-request baselines on the clone, for comparison against
# the per-step trends this produces:
#
#   /                17 ms,  0 queries,  84 KB   (page-cached)
#   /listings        89 ms,  6 queries,  55 KB   <- most expensive read
#   /listings/{id}   45 ms,  7 queries,  52 KB
#   /post            17 ms,  0 queries,  54 KB   (page-cached)
#
# PREREQUISITES
#   1. Test accounts seeded -- see k8s/journey-seed-job.yaml
#   2. RECAPTCHA_LOAD_TEST_TOKEN set on the target deployment, matching
#      RECAPTCHA_TOKEN below. Ad posting fails without it (every
#      submission would call Google and be rate-limited).
#   3. Run against the clone (www.foasfo.ca). This test WRITES.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-journey-script
  namespace: laravel-spa
data:
  journey.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Trend, Counter } from 'k6/metrics';
    import { b64encode, b64decode } from 'k6/encoding';
    import exec from 'k6/execution';

    const HOST = __ENV.TARGET_HOST || 'www.foasfo.ca';
    const BASE = `https://${HOST}`;
    const AUTH = __ENV.AUTH || '';
    const BASIC = AUTH ? 'Basic ' + b64encode(AUTH) : null;
    const RECAPTCHA_TOKEN = __ENV.RECAPTCHA_TOKEN || '';
    const ACCOUNT_COUNT = parseInt(__ENV.ACCOUNT_COUNT || '200', 10);
    // No default: the password comes from the loadtest-credentials
    // Secret (see secrets/, gitignored). An empty value fails the login
    // loudly rather than hardcoding a credential in version control.
    const ACCOUNT_PASSWORD = __ENV.ACCOUNT_PASSWORD || '';
    const KNOWN_LISTING = __ENV.KNOWN_LISTING || '';
    const PHOTO_KB = parseInt(__ENV.PHOTO_KB || '200', 10);
    const SUBCATEGORY_REQUESTS = (__ENV.SUBCATEGORY_REQUESTS || 'true') !== 'false';

    // Peak arrivals per second across ALL personas. Each scenario takes
    // its share via the weights below, so changing this one number
    // rescales the whole population.
    const PEAK = parseInt(__ENV.PEAK_ARRIVALS || '400', 10);

    // READ personas scale with traffic, so they are a share of arrivals.
    const WEIGHT = {
      scroller: 0.55,   // bored, killing time, long think times
      searcher: 0.28,   // knows what they want, uses search
      checker:  0.17,   // "is that snowmobile still for sale?"
    };

    // WRITE personas are FIXED absolute rates, not a share -- and that
    // distinction matters more than it looks.
    //
    // Writes do not scale with browsing. Reads scale with visitors;
    // posting scales with the (much smaller, largely independent) seller
    // population. Expressing posting as "2% of arrivals" meant 8 ads/sec
    // at 400 arrivals/sec -- 691,000 ads a day, which is nonsense for a
    // classifieds site.
    //
    // It also broke the measurement: every published ad fires
    // HomeFeedInvalidator, flushing both the home feed and the page
    // cache. At 8 ads/sec that is a cache flush every eighth of a
    // second, so the page cache would never be hit and the test would
    // report permanently-cold numbers -- making the caching work look
    // worthless when it is not.
    //
    // These are per-generator, so multiply by 4. Tuned to resemble a
    // busy-but-real site: a few ads a minute, not a few a second.
    const WRITE_RATE = {
      saver:     parseFloat(__ENV.RATE_SAVER     || '2'),    //  8/s site-wide
      enquirer:  parseFloat(__ENV.RATE_ENQUIRER  || '1'),    //  4/s
      poster:    parseFloat(__ENV.RATE_POSTER    || '0.08'), // ~1 ad / 3s
      yardsaler: parseFloat(__ENV.RATE_YARDSALER || '0.02'), // ~1 / 12s
    };

    // One Trend per journey step, so the summary is a per-activity cost
    // table instead of a single blended number. This is the whole point
    // of the rewrite.
    const T = {
      home:        new Trend('step_home', true),
      subcategory: new Trend('step_subcategory', true),
      listings:    new Trend('step_listings_index', true),
      search:      new Trend('step_search', true),
      detail:      new Trend('step_listing_detail', true),
      login:       new Trend('step_login', true),
      save:        new Trend('step_save_ad', true),
      enquire:     new Trend('step_contact_seller', true),
      postForm:    new Trend('step_post_form', true),
      postAd:      new Trend('step_publish_ad', true),
      yardSale:    new Trend('step_post_yard_sale', true),
    };
    const stepErrors = new Counter('step_errors');
    // Separate from step_errors: a login that silently fails makes every
    // write persona run as a guest and report false passes, so it needs
    // to be visible on its own in the summary.
    const loginFailures = new Counter('login_failures');

    // RAMP_UNIT scales the whole timeline so a smoke run can use the
    // identical script and scenario shape as a full run -- verifying the
    // personas actually work without waiting 14 minutes to find out one
    // of them never fired. Full run: '1m'. Smoke: '10s'.
    const U = __ENV.RAMP_UNIT || '1m';
    const n = parseInt(U, 10) || 1;
    const unit = U.endsWith('s') ? 's' : 'm';
    const dur = (mult) => `${n * mult}${unit}`;
    const WRITE_DURATION = __ENV.WRITE_DURATION || '14m';

    // STAIRCASE MODE. The ramp below climbs straight past the ceiling, so
    // every run ends in a queue and reports the queue rather than the
    // limit -- runs 2 and 4 both completed 85-116 sessions/sec while being
    // offered 400/sec, and the excess simply accumulated as latency.
    //
    // Set STAIR_STEPS to a comma-separated list of per-generator arrival
    // rates (multiply by the generator count for site-wide) and each one
    // is approached and then HELD, so latency has time to settle and each
    // step can be judged on its own. The highest step whose p95 is still
    // acceptable is the actual answer to "how many visitors can we take".
    const STEPS = (__ENV.STAIR_STEPS || '').split(',')
      .map((v) => parseFloat(v.trim()))
      .filter((v) => !isNaN(v) && v > 0);
    const STAIRS = STEPS.length > 0;
    const STAIR_HOLD = __ENV.STAIR_HOLD || '3m';
    const STAIR_RAMP = __ENV.STAIR_RAMP || '30s';
    // VU pre-allocation has to be sized for the TALLEST step, not the
    // mean: if k6 runs out of VUs it silently stops meeting the target
    // rate, which looks exactly like the server coping.
    // CONTINUOUS MODE -- hold one rate for as long as the pod lives.
    //
    // The staircase answers "where is the knee". It cannot answer "is the
    // site still fine at 09:00 tomorrow", because it ends. SOAK=true
    // replaces the climb with ONE rate held indefinitely, which is the
    // shape a site actually experiences.
    //
    // THE RATE IS PER GENERATOR AND IS MEANT TO STAY FIXED. Site-wide
    // load is SOAK_RATE x replicas, so the live throttle is the replica
    // count -- `kubectl scale` -- and no restart is needed to change the
    // load. Editing SOAK_RATE instead needs a rollout, which is why it
    // is the gear ratio and not the accelerator.
    //
    // SOAK_ROLE splits reads from writes onto separate Deployments, and
    // that is not tidiness. k6 arrival rates are INTEGERS, and the write
    // personas are rare: at 24 generators the yard-saler's true share
    // rounds to zero, gets floored to one per window, and the test then
    // posts 24x the intended rate. Worse, the inflation GROWS with the
    // replica count, so scaling the readers would silently change the
    // write load too and no two moments of the soak would be comparable.
    // One writer pod at the true site-wide rate has no such floor.
    const SOAK = (__ENV.SOAK || 'false') === 'true';
    const SOAK_RATE = parseFloat(__ENV.SOAK_RATE || '6');
    const SOAK_DURATION = __ENV.SOAK_DURATION || '720h';
    const SOAK_ROLE = __ENV.SOAK_ROLE || 'both';

    const CEIL = SOAK ? SOAK_RATE : (STAIRS ? Math.max.apply(null, STEPS) : PEAK);

    // PRE-ALLOCATION IS SIZED SEPARATELY FROM THE TALLEST STEP.
    //
    // preAllocatedVUs is claimed at startup, before a single request goes
    // out, and it was derived from CEIL -- the tallest step. That is fine
    // while the tallest step is one the box can carry. It stops being
    // fine the moment a staircase deliberately climbs past what the box
    // can carry: at a 300/sec ceiling (25 per generator) the formula asks
    // for 500 VUs per generator, 6,000 across twelve, about 12.7 GB on a
    // box with ~13.5 GB usable. The run would be OOM-killed during
    // startup and never reach even the first step.
    //
    // VU_BUDGET is the per-generator arrival rate to pre-allocate FOR:
    // set it to the tallest step still expected to be healthy and the
    // generators begin with exactly what the good steps need. Above it,
    // k6 grows towards maxVUs and drops iterations while growing -- which
    // is the honest signature of a rig past its limit, and it arrives as
    // data instead of as a crash.
    const VU_BUDGET = parseFloat(__ENV.VU_BUDGET || '') || CEIL;
    const PRE = Math.min(CEIL, VU_BUDGET);

    // WHICH STEP A SAMPLE CAME FROM.
    //
    // The staircase already held each rate long enough to be judged on
    // its own, but nothing recorded WHICH step a measurement was taken
    // in, so every sample landed in one undifferentiated pool and the run
    // could say no more than "the knee is somewhere between 48 and 192
    // arrivals/sec". Tagging each sample with its step is the whole
    // difference between that and an answer.
    //
    // GENERATORS is used only for labelling -- per-generator rate times
    // generator count is the site-wide rate, which is the number the
    // answer gets quoted in. It does not change the load applied (that is
    // `parallelism` and the rates), so a wrong value here mislabels the
    // table and nothing else.
    const GENERATORS = parseInt(__ENV.GENERATORS || '12', 10);

    function secs(d) {
      const m = String(d).trim().match(/^([\d.]+)\s*(ms|s|m|h)?$/);
      if (!m) return 0;
      const v = parseFloat(m[1]);
      const u = m[2] || 's';
      return u === 'ms' ? v / 1000 : u === 'm' ? v * 60 : u === 'h' ? v * 3600 : v;
    }

    const RAMP_S = secs(STAIR_RAMP);
    const HOLD_S = secs(STAIR_HOLD);
    const PERIOD_S = RAMP_S + HOLD_S;
    const STAIR_LABELS = STEPS.map((v, i) => `s${i + 1}_${Math.round(v * GENERATORS)}`);

    // Samples taken while the rate is still CHANGING are labelled 'ramp'
    // and belong to no step: latency during a transition describes
    // neither the step below nor the step above. Previously they were
    // mixed into the totals, which is part of why the tail looked so bad
    // -- a 30s transition into the next step is 30s of queue drain.
    //
    // 'tail' is the write personas outliving the staircase, which they do
    // by design.
    function currentStair() {
      // In soak mode there is no step to attribute a sample to -- the
      // rate is constant and the axis of interest is wall-clock time,
      // which Prometheus already has. One label keeps the queries that
      // filter on `stair` working against both kinds of run.
      if (SOAK) return 'soak';
      if (!STAIRS) return 'ramp';
      const t = exec.instance.currentTestRunDuration / 1000;
      const i = Math.floor(t / PERIOD_S);
      if (i >= STEPS.length) return 'tail';
      return (t - i * PERIOD_S) < RAMP_S ? 'ramp' : STAIR_LABELS[i];
    }

    // READ RATES ARE PER MINUTE, NOT PER SECOND -- the same trap the
    // write rates already document, found again at finer steps.
    //
    // k6 arrival rates are integers. Each read persona takes a share of
    // the step (55/28/17), and at one step per second those shares round
    // to whole numbers so coarse that both the rate and the MIX come out
    // wrong. At 8 arrivals/sec per generator: 4.4 -> 4, 2.24 -> 2,
    // 1.36 -> 1, which is 7 per generator, not 8 -- so the step labelled
    // 96/sec site-wide actually offered 84, and the 2026-10-15 run's
    // second step was 12.5% below what its own report said.
    //
    // At finer steps it gets worse, not better: 4/6/8/10 per generator
    // would have rounded to 4/6/7/11, turning an even staircase into an
    // uneven one with a 57% jump in the middle and a mix that drifts from
    // 57/29/14 to 55/27/18 as it climbs.
    //
    // A sixty-second window gives the rounding sixty times the
    // resolution: every step below now comes out within 0.5% of its
    // intended rate with the mix held. Pacing is unaffected -- k6 spaces
    // arrivals evenly across the time unit either way, so 132/minute is
    // one arrival every 455 ms, exactly as 2.2/sec would be.
    const READ_UNIT_S = 60;
    const perUnit = (ratePerSecond) => Math.max(1, Math.round(ratePerSecond * READ_UNIT_S));

    function stairStages(weight) {
      const out = [];
      for (const step of STEPS) {
        const target = perUnit(step * weight);
        out.push({ duration: STAIR_RAMP, target });
        out.push({ duration: STAIR_HOLD, target });
      }
      return out;
    }

    function stages(weight) {
      const at = (f) => perUnit(PEAK * weight * f);
      return [
        { duration: dur(1), target: at(0.15) },
        { duration: dur(2), target: at(0.15) },
        { duration: dur(1), target: at(0.4) },
        { duration: dur(2), target: at(0.4) },
        { duration: dur(1), target: at(0.7) },
        { duration: dur(2), target: at(0.7) },
        { duration: dur(1), target: at(1.0) },
        { duration: dur(3), target: at(1.0) },
        { duration: dur(1), target: 1 },
      ];
    }

    // Read persona: ramps with overall traffic.
    function readScenario(exec, weight) {
      // Soak: one rate, held. preAllocatedVUs is the FULL steady-state
      // demand (Little's Law: rate x 20s session), not a fraction of it,
      // because a soak has no ramp during which to grow -- a replica
      // scaled up at 14:00 must be at its rate within seconds or the
      // site-wide figure is wrong for as long as it takes to grow, and
      // k6 drops scheduled iterations while growing.
      if (SOAK) {
        return {
          executor: 'constant-arrival-rate',
          exec,
          timeUnit: `${READ_UNIT_S}s`,
          rate: perUnit(SOAK_RATE * weight),
          duration: SOAK_DURATION,
          preAllocatedVUs: Math.max(20, Math.round(SOAK_RATE * weight * 20)),
          maxVUs: Math.max(60, Math.round(SOAK_RATE * weight * 36)),
        };
      }
      return {
        executor: 'ramping-arrival-rate',
        exec,
        // Per minute -- see perUnit() above. The VU sizing below stays in
        // arrivals per SECOND, because Little's Law is about concurrency
        // and that does not care how the rate is spelled.
        timeUnit: `${READ_UNIT_S}s`,
        startRate: 1,
        // Generous headroom: if k6 runs out of VUs it silently stops
        // hitting the target rate, which looks like the server coping.
        // Sizing these is a memory problem, not a guess.
        //
        // The three read weights sum to 1.0, so total maxVUs across the
        // scenarios is CEIL x multiplier. A k6 VU measured at 2.12 MB in
        // the staircase run (2.9 GB at 1,366 VUs), so the multiplier is
        // bounded by the generator's memory limit:
        //
        //   CEIL=50  mult=40  ->  2,000 VUs =  4.1 GB   (what ran)
        //   CEIL=50  mult=50  ->  2,500 VUs =  5.2 GB   OOMs a 6Gi limit
        //   CEIL=100 mult=45  ->  4,500 VUs =  9.5 GB   needs ~11Gi
        //
        // 36 (20% headroom) rather than 45, because of what the ceiling
        // question actually requires. PAST the knee, VU demand is
        // unbounded: the site slows, sessions stop completing, and the
        // generator needs ever more VUs to sustain the same arrival rate.
        // No allocation survives that. What matters is that the
        // generators are healthy up to and including the last GOOD step,
        // where sessions complete predictably. Spending memory on
        // surviving past the breaking point buys nothing and costs
        // reach -- 36 instead of 45 is 25% more arrivals from the same
        // RAM.
        //
        // preAllocatedVUs was 8x, and that was the bug the smoke run
        // found. k6 pre-allocates this many at startup and grows towards
        // maxVUs only as demand appears -- and while it is growing it
        // DROPS scheduled iterations. The smoke run reported 44 dropped
        // per generator at 3 arrivals/sec, which no server could have
        // caused.
        //
        // The multiplier has to be the real session length, because that
        // is what Little's Law requires: concurrent = arrival rate x
        // session duration. Measured on that run, iteration_duration
        // averaged 17.3s (p95 38.9s), so each sustained arrival/sec
        // needs ~17 concurrent VUs, not 8. The old comment here assumed
        // ~30s, which was a guess in the other direction; 20 is the
        // measured 17.3 with a small margin.
        //
        // Cost at the real staircase: CEIL 16 x 20 = 320 VUs per
        // generator pre-allocated, 3,840 across twelve, about 8 GB.
        // That is memory that steady state needs anyway -- 192
        // arrivals/sec x 17.3s is ~3,300 concurrent VUs -- so it is
        // brought forward, not added.
        preAllocatedVUs: Math.max(20, Math.round(PRE * weight * 20)),
        maxVUs: Math.max(100, Math.round(CEIL * weight * 36)),
        stages: STAIRS ? stairStages(weight) : stages(weight),
      };
    }

    // Write persona: a steady low rate for the whole run, independent of
    // how hard the read personas are pushing.
    function writeScenario(exec, ratePerSecond) {
      return {
        executor: 'constant-arrival-rate',
        exec,
        // Rate expressed per TEN minutes, not per minute.
        //
        // k6 needs an integer rate, and `Math.max(1, ...)` floors it at
        // one per window. Splitting the same site-wide write load across
        // 12 generators instead of 8 makes each per-generator rate small
        // enough to hit that floor: a yard-sale rate of 0.00667/s rounds
        // to 0 per minute, gets floored to 1, and the test then posts
        // 0.2 yard sales a second site-wide instead of 0.08 -- 2.5x the
        // intended write load, silently. The poster rate was 25% over
        // for the same reason.
        //
        // A ten-minute window gives the rounding ten times the
        // resolution, so 0.00667/s becomes exactly 4 per 10m and the
        // rare personas stay rare.
        rate: Math.max(1, Math.round(ratePerSecond * 600)),
        timeUnit: '10m',
        duration: SOAK ? SOAK_DURATION : WRITE_DURATION,
        preAllocatedVUs: Math.max(5, Math.ceil(ratePerSecond * 30)),
        maxVUs: Math.max(20, Math.ceil(ratePerSecond * 200)),
      };
    }

    // PER-STEP REPORTING, AND WHY IT IS DONE WITH THRESHOLDS.
    //
    // k6 only materialises a tagged submetric -- `step_home{stair:s3_96}`
    // -- if something refers to it, and a threshold is the only thing
    // that can. So the ones below are declared for their side effect:
    // each makes its step's numbers appear separately, per staircase
    // step, in the summary and in handleSummary's data. The limits are
    // deliberately unreachable; these are not judgements, they are the
    // table of contents.
    const STAIR_METRICS = [
      'http_reqs', 'http_req_failed', 'http_req_duration', 'iteration_duration',
      'step_home', 'step_subcategory', 'step_listings_index', 'step_search',
      'step_listing_detail', 'step_login', 'step_save_ad', 'step_contact_seller',
      'step_post_form', 'step_publish_ad', 'step_post_yard_sale',
    ];

    // Which personas this pod runs. 'both' is every run that is not a
    // split soak; a missing key simply means the scenario is not started.
    function pickScenarios(all) {
      if (!SOAK || SOAK_ROLE === 'both') return all;

      const READ = ['scroller', 'searcher', 'checker'];
      const WRITE = ['saver', 'enquirer', 'poster', 'yardsaler'];
      let keep;

      // Singular and plural both accepted, because the StatefulSets are
      // named k6-soak-readers and k6-soak-writer and the env was written
      // to match the names.
      if (SOAK_ROLE === 'readers' || SOAK_ROLE === 'reader') keep = READ;
      else if (SOAK_ROLE === 'writers' || SOAK_ROLE === 'writer') keep = WRITE;
      // THROW, rather than defaulting to one of them.
      //
      // This previously fell back to READ for any unrecognised value, so
      // SOAK_ROLE=writer -- off by one letter -- quietly produced a
      // "writer" pod running the read personas: no write load at all,
      // plus an extra generator's worth of reads, and nothing in the
      // output said so. A soak that silently applies the wrong traffic
      // is worse than one that refuses to start.
      else throw new Error(`SOAK_ROLE must be readers, writers or both -- got "${SOAK_ROLE}"`);

      const out = {};
      for (const k of keep) out[k] = all[k];
      return out;
    }

    function stairThresholds() {
      // The four real judgements, reported and not enforced: the run has
      // to finish so the whole curve is visible, including past the knee.
      const t = {
        http_req_failed: ['rate<0.01'],
        'step_home': ['p(95)<1000'],
        'step_listings_index': ['p(95)<2000'],
        'step_publish_ad': ['p(95)<5000'],
      };
      // Soak has one step, so there is nothing to break out -- and a
      // soak never prints a summary anyway (the pod does not end), so
      // the submetrics would exist only to be discarded.
      if (SOAK) return t;
      for (const label of STAIR_LABELS.concat(['ramp', 'tail'])) {
        for (const m of STAIR_METRICS) {
          t[`${m}{stair:${label}}`] = m === 'http_reqs' ? ['count>=0']
            : m === 'http_req_failed' ? ['rate<=1']
            : ['p(95)<3600000'];
        }
      }
      return t;
    }

    export const options = {
      hosts: { [HOST]: __ENV.LB_IP || '192.168.100.200' },
      // WHO SENT THIS SAMPLE, and why Prometheus needs to be told.
      //
      // Twelve generators push to one Prometheus. Without something to
      // tell them apart they all write the SAME series -- same metric,
      // same labels -- and Prometheus rejects the collisions as duplicate
      // samples for a timestamp. Eleven generators' worth of data would
      // disappear into an error log, which is the same failure as before
      // wearing different clothes.
      //
      // The pod name is the natural identity and it comes in from a
      // fieldRef. Queries that want the site-wide figure just do not
      // group by it.
      tags: { gen: __ENV.POD_NAME || 'unknown' },
      // CARDINALITY. k6 tags every request with `url` and `name`, and
      // this test fetches /listings/{id} with ~98,000 possible ids -- so
      // the default tag set would create a Prometheus series per listing
      // ever viewed, for every metric, times twelve generators. The
      // per-step trends carry the information those tags would have, so
      // the tags go.
      systemTags: ['status', 'method', 'error_code', 'expected_response',
                   'scenario', 'check', 'group'],
      scenarios: pickScenarios({
        scroller:  readScenario('scroller', WEIGHT.scroller),
        searcher:  readScenario('searcher', WEIGHT.searcher),
        checker:   readScenario('checker',  WEIGHT.checker),
        saver:     writeScenario('saver',     WRITE_RATE.saver),
        enquirer:  writeScenario('enquirer',  WRITE_RATE.enquirer),
        poster:    writeScenario('poster',    WRITE_RATE.poster),
        yardsaler: writeScenario('yardsaler', WRITE_RATE.yardsaler),
      }),
      thresholds: stairThresholds(),
      // `count` is what turns a step into an achieved rate: count over the
      // hold's duration, summed across generators, is the traffic the site
      // actually completed at that step. Without it a step that quietly
      // stopped meeting its target looks like a step the site handled.
      summaryTrendStats: ['count', 'avg', 'med', 'p(90)', 'p(95)', 'p(99)', 'max'],
      // Response bodies are 50-85 KB; at thousands of VUs that is real
      // generator memory. Only keep them where the script parses one.
      discardResponseBodies: true,
    };

    function headers(extra) {
      // Accept-Encoding is set explicitly because k6 does NOT send one.
      // Probed directly on 2026-10-14: with no header the response came
      // back with no Content-Encoding, so every earlier run measured
      // uncompressed traffic and the gzip middleware was never exercised.
      // k6 decompresses transparently, so the steps that parse a body
      // (scraping a listing id, a CSRF token) still see plain HTML --
      // body_len was identical with and without the header.
      const h = Object.assign({ 'Accept-Encoding': 'gzip' }, extra || {});
      if (BASIC) h.Authorization = BASIC;
      return h;
    }

    // Real think time is long-tailed: most clicks are quick, a few are
    // very slow (someone reading an ad, or distracted). A uniform
    // 1 + random()*2 -- what the old test used -- understates both ends
    // and makes arrivals unnaturally regular.
    function think(medianSeconds, spread) {
      const u1 = Math.max(Number.EPSILON, Math.random());
      const u2 = Math.random();
      const gauss = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
      const t = medianSeconds * Math.exp((spread || 0.6) * gauss);
      sleep(Math.min(Math.max(t, 0.3), 90));
    }

    function step(trend, name, fn) {
      // Set on the VU BEFORE the request, so k6's own http_req_* metrics
      // carry the step too -- not just the custom trend below. That is
      // what makes per-step throughput and failure rates readable, and
      // those are the two figures that can be summed across generators
      // exactly.
      const stair = currentStair();
      exec.vu.tags.stair = stair;
      const res = fn();
      trend.add(res.timings.duration, { stair });
      const ok = check(res, { [name]: (r) => r.status === 200 || r.status === 302 });
      if (!ok) stepErrors.add(1, { step: name });
      return res;
    }

    // For POSTs, status alone proves nothing: Laravel answers a
    // validation failure with 302 straight back to the submitting page,
    // which a `200 || 302` check counts as success. That is exactly how
    // publish_ad, post_yard_sale and contact_seller all reported 100%
    // passing while creating zero rows.
    //
    // A real success redirects somewhere ELSE. Requires redirects: 0 on
    // the request, or there is no Location header to inspect.
    const QUESTIONS = [
      'Is it still available?',
      'Is the price negotiable?',
      'Can you hold it for me?',
      'When can I see it?',
      'Where is it located for pickup?',
      'Can you send more photos?',
    ];

    function writeStep(trend, name, submittedFrom, fn) {
      const stair = currentStair();
      exec.vu.tags.stair = stair;
      const res = fn();
      trend.add(res.timings.duration, { stair });
      const dest = String(res.headers['Location'] || '');
      const ok = check(res, {
        [name]: (r) => r.status === 302 && dest !== '' && !dest.includes(submittedFrom),
      });
      if (!ok) stepErrors.add(1, { step: name });
      return res;
    }

    function get(path, extra) {
      return http.get(`${BASE}${path}`, { headers: headers(extra) });
    }

    // ---- shared journey fragments -------------------------------------

    function loadHome() {
      return step(T.home, 'home', () => get('/'));
    }

    // A subcategory view. Today this is client-side only, so it is
    // modelled as the partial reload it WILL be once Phase 2 lands --
    // which is also how we will measure whether Phase 2 helped.
    const CATEGORIES = ['Vehicle', 'Computer', 'Kitchen', 'Furniture', 'Tool', 'Pet'];
    function viewSubcategory() {
      const c = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
      // A plain page load, NOT an Inertia partial.
      //
      // Sending X-Inertia without a matching X-Inertia-Version makes
      // Inertia return 409 Conflict (asset-version mismatch), which is
      // what made this step fail 100% of the time on the first smoke
      // run. There is also nothing to fetch partially yet: the
      // ?category= handling is Phase 2.
      //
      // So this measures what a category view costs TODAY -- a full,
      // uncached home page, since CacheGuestPage excludes any request
      // carrying a query string. That is deliberately the "before"
      // number Phase 2 will be compared against.
      // SUBCATEGORY_REQUESTS=false models what the site does TODAY: a
      // category click filters the already-loaded cards client-side and
      // issues no server request at all. The request below was always a
      // stand-in for a change that has not been built, and it was 27% of
      // all traffic in earlier runs -- a quarter of the offered load that
      // production never sees, costing 49 statements a time because a
      // query string bypasses the page cache.
      //
      // Left available because it is still the honest "before" figure for
      // that change. But a run meant to find the real ceiling must not
      // include it.
      // No sleep here on purpose: the caller already does think(6, 0.8)
      // after this step, which is the time the visitor spends reading the
      // filtered list. Pausing again would halve the effective load.
      if (!SUBCATEGORY_REQUESTS) {
        return null;
      }
      return step(T.subcategory, 'subcategory', () =>
        get(`/?category=${encodeURIComponent(c)}`));
    }

    function openListingsIndex() {
      const res = step(T.listings, 'listings_index', () =>
        http.get(`${BASE}/listings`, { headers: headers(), responseType: 'text' }));
      // Anchored to the listings prop. A bare /&quot;id&quot;:(\d+)/ matches the
      // `categories` prop first ({"id":1,"name":"Electronics"}), so it
      // returned 1 and every detail/save/contact request 404'd -- the
      // cause of the detail step's 28% pass rate on the first smoke run.
      const m = res.body && res.body.match(/&quot;listings&quot;:\{&quot;data&quot;:\[\{&quot;id&quot;:(\d+)/);
      return m ? m[1] : KNOWN_LISTING;
    }

    function openDetail(id) {
      if (!id) return;
      step(T.detail, 'listing_detail', () => get(`/listings/${id}`));
    }

    // Per-VU login, cached for the VU's lifetime. Logging in on every
    // iteration would make the test mostly measure authentication.
    let session = null;
    function ensureLoggedIn() {
      if (session) return true;
      const email = `loadtest+${(__VU % ACCOUNT_COUNT) + 1}@example.test`;
      const page = http.get(`${BASE}/login`, { headers: headers(), responseType: 'text' });
      const token = (page.cookies['XSRF-TOKEN'] || [{}])[0].value;
      // redirects: 0 is load-bearing. k6 follows redirects by default, so
      // without it a successful login reports the FINAL page's status
      // (200) and carries no Location header -- and the 302 check below
      // then rejects every successful login, locking the write personas
      // out of their own journeys.
      const res = step(T.login, 'login', () => http.post(`${BASE}/login`,
        { email, password: ACCOUNT_PASSWORD },
        { headers: headers(token ? { 'X-XSRF-TOKEN': decodeURIComponent(token) } : {}),
          redirects: 0 }));

      // A FAILED login also returns 302 -- straight back to /login with
      // the validation errors -- so the status alone proves nothing.
      // Accepting any 302 meant write personas ran unauthenticated and
      // still reported passes, because the save POST's redirect to
      // /login counted as success. Verified against the running app: a
      // successful login sends Location: https://<host>, a failed one
      // sends .../login.
      const dest = String(res.headers['Location'] || '');
      session = res.status === 302 && dest !== '' && !dest.includes('/login');
      if (!session) loginFailures.add(1);
      return session;
    }

    function csrf() {
      const jar = http.cookieJar().cookiesForURL(BASE);
      const t = jar['XSRF-TOKEN'];
      return t ? decodeURIComponent(t[0]) : '';
    }

    // ---- personas ------------------------------------------------------

    // Bored, killing time. Long think times, lots of browsing, no writes.
    export function scroller() {
      loadHome();
      think(8, 0.7);
      const rounds = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < rounds; i++) {
        viewSubcategory();
        think(6, 0.8);
      }
      const id = openListingsIndex();
      think(5, 0.7);
      openDetail(id);
      think(10, 0.9);
    }

    // Knows what they want. Exercises the unindexed LIKE search, which no
    // previous test touched.
    const TERMS = ['snowmobile', 'truck', 'desk', 'fridge', 'bike', 'ski-doo', 'laptop'];
    export function searcher() {
      loadHome();
      think(3, 0.5);
      const q = TERMS[Math.floor(Math.random() * TERMS.length)];
      const res = step(T.search, 'search', () =>
        http.get(`${BASE}/listings?q=${q}`, { headers: headers(), responseType: 'text' }));
      const m = res.body && res.body.match(/&quot;listings&quot;:\{&quot;data&quot;:\[\{&quot;id&quot;:(\d+)/);
      think(3, 0.5);
      openDetail(m ? m[1] : KNOWN_LISTING);
      think(4, 0.6);
    }

    // "Is that snowmobile still for sale?" One target, very short session.
    export function checker() {
      loadHome();
      think(2, 0.4);
      openDetail(KNOWN_LISTING);
    }

    export function saver() {
      if (!ensureLoggedIn()) return;
      loadHome();
      think(4, 0.6);
      const id = openListingsIndex();
      think(3, 0.5);
      if (id) {
        step(T.save, 'save_ad', () => http.post(`${BASE}/listings/${id}/save`, {},
          { headers: headers({ 'X-XSRF-TOKEN': csrf() }), redirects: 0 }));
      }
      think(5, 0.7);
      loadHome();
    }

    export function enquirer() {
      if (!ensureLoggedIn()) return;
      const id = openListingsIndex();
      think(6, 0.7);
      if (id) {
        openDetail(id);
        think(8, 0.8);
        // ConversationController::store validates
        // questions[] against STANDARD_QUESTIONS -- free text is
        // rejected, which is why this step reported 100% passing while
        // creating zero conversations.
        writeStep(T.enquire, 'contact_seller', '/inquiries', () => http.post(`${BASE}/listings/${id}/inquiries`,
          { 'questions[0]': QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)] },
          { headers: headers({ 'X-XSRF-TOKEN': csrf() }), redirects: 0 }));
      }
    }

    // The heaviest journey: form, photos, preview, publish.
    const PHOTO = (() => {
      // Must be an ArrayBuffer, NOT a string.
      //
      // b64decode(..., 's') returns a JavaScript string, and JS strings
      // are UTF-16: every PNG byte above 127 is mangled on the way back
      // to bytes, so the upload arrives as a corrupt image and Laravel's
      // `image` rule rejects it. That produced zero listings and zero
      // yard sales while the status checks reported success. Verified by
      // reproducing the same POST with curl + a real file, which created
      // listing 100070 first try.
      //
      // Decode to bytes, then copy into a larger zero-filled buffer.
      // Trailing bytes after IEND are ignored by getimagesize, so this
      // is a valid image at a realistic upload size.
      const head = new Uint8Array(b64decode(
        'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==',
        'std'));
      const total = Math.max(head.length, PHOTO_KB * 1024);
      const buf = new Uint8Array(total);
      buf.set(head, 0);
      return buf.buffer;
    })();

    export function poster() {
      if (!ensureLoggedIn()) return;
      step(T.postForm, 'post_form', () => get('/post'));
      think(25, 0.8); // filling in a form takes real time
      const photos = 3 + Math.floor(Math.random() * 3);
      const payload = {
        title: `Load test listing ${__VU}-${__ITER}`,
        listing_type: 'selling',
        category_id: 'Vehicle — Snowmobile',
        description: 'Generated by the journey load test.',
        price: '1200.00',
        location: 'Testville',
        acknowledged_accurate: 'true',
        g_recaptcha_response: RECAPTCHA_TOKEN,
      };
      for (let i = 0; i < photos; i++) {
        payload[`images[${i}]`] = http.file(PHOTO, `photo${i}.png`, 'image/png');
      }
      // Referer matters: without it Laravel's back() on a validation
      // failure redirects to '/', which is indistinguishable from a
      // successful redirect. With it, a rejection goes back to /post and
      // writeStep catches it.
      writeStep(T.postAd, 'publish_ad', '/post', () => http.post(`${BASE}/post`, payload,
        { headers: headers({ 'X-XSRF-TOKEN': csrf(), Referer: `${BASE}/post` }), redirects: 0 }));
      think(6, 0.6);
    }

    export function yardsaler() {
      if (!ensureLoggedIn()) return;
      loadHome();
      think(20, 0.8);
      // YardSaleController requires title AND address; `location`,
      // `starts_at` and `ends_at` are not fields, and photos arrive as
      // `pictures`, not `images`. Sending the wrong shape made this step
      // report success while writing nothing.
      const title = `Yard sale ${__VU}-${__ITER}`;
      const payload = {
        title,
        address: '12 Test Road, Testville',
        date: 'Saturday 1 December',
        times: '9am - 2pm',
        description: 'Generated by the journey load test.',
        'bundles[0][name]': 'Garage bundle',
        'bundles[0][items][0]': 'Tools',
        g_recaptcha_response: RECAPTCHA_TOKEN,
      };
      for (let i = 0; i < 2; i++) {
        payload[`pictures[${i}]`] = http.file(PHOTO, `yard${i}.png`, 'image/png');
      }

      // NOT writeStep(), and the reason matters.
      //
      // writeStep()'s rule is "a real success redirects somewhere ELSE
      // than the submitting page", which is right for publish_ad and
      // contact_seller. Here it is not merely wrong, it is INVERTED.
      // YardSaleController::store() ends in `back()`, so a successful
      // create redirects to the Referer -- /yard-sales -- which is the
      // very URL a validation failure returns to. So the check failed
      // on every successful create, and the ones it passed were the
      // genuine failures that redirected somewhere else. The smoke run
      // reported 37% passing; the truth was close to its inverse.
      //
      // `back()` is correct for the site: the Inertia panel stays open
      // and the list refreshes. So the test changes, not the controller.
      // The only honest proof a row was written is to read it back, and
      // the unique title makes that unambiguous.
      //
      // The extra GET is affordable precisely because this is the
      // rarest persona -- one yard sale per 12 seconds site-wide.
      // Tagged by hand because this step deliberately does not use
      // writeStep() -- see the note above.
      exec.vu.tags.stair = currentStair();
      const posted = http.post(`${BASE}/yard-sales`, payload,
        { headers: headers({ 'X-XSRF-TOKEN': csrf(), Referer: `${BASE}/yard-sales` }), redirects: 0 });
      T.yardSale.add(posted.timings.duration);
      const listed = posted.status === 302 ? get('/yard-sales') : null;
      const yardSaleOk = check(posted, {
        post_yard_sale: () => posted.status === 302
          && listed !== null
          && listed.status === 200
          && String(listed.body).includes(title),
      });
      if (!yardSaleOk) stepErrors.add(1, { step: 'post_yard_sale' });
      think(8, 0.7);
    }

    // THE TWELVE SUMMARIES PROBLEM.
    //
    // Each generator prints its own summary and they do not combine the
    // same way. Counts and rates add exactly; a p95 does not -- it is a
    // position in one generator's sample set, so averaging twelve of them
    // means nothing. The honest merge treats the twelve as twelve
    // estimates of the same quantity and reports their median with the
    // spread, which is what k6-journey-merge.py does.
    //
    // This emits one machine-readable line per generator for it to read.
    // Defining handleSummary replaces k6's own end-of-test summary, so a
    // short human table goes out alongside it -- enough to read a smoke
    // run straight from `kubectl logs` without the collector.
    function statOf(data, metric, label, stat) {
      const m = data.metrics[`${metric}{stair:${label}}`];
      return m && m.values ? m.values[stat] : undefined;
    }

    function asMs(v) {
      if (v === undefined || v === null) return '-';
      return v >= 1000 ? (v / 1000).toFixed(2) + 's' : v.toFixed(0) + 'ms';
    }

    function humanTable(data) {
      const pad = (v, w) => String(v).padStart(w);
      const lines = ['', `  this generator only -- ${GENERATORS} of these merge into the real numbers`,
        `  ${'step'.padEnd(10)}${pad('reqs', 8)}${pad('fail%', 8)}${pad('home p95', 11)}` +
        `${pad('listings p95', 14)}${pad('detail p95', 12)}${pad('iter p95', 10)}`];
      for (const label of STAIR_LABELS.concat(['tail'])) {
        const reqs = statOf(data, 'http_reqs', label, 'count');
        if (!reqs) continue;
        const passes = statOf(data, 'http_req_failed', label, 'passes') || 0;
        const fails = statOf(data, 'http_req_failed', label, 'fails') || 0;
        const checked = passes + fails;
        lines.push(`  ${label.padEnd(10)}${pad(reqs, 8)}` +
          `${pad(checked ? (100 * passes / checked).toFixed(2) : '-', 8)}` +
          `${pad(asMs(statOf(data, 'step_home', label, 'p(95)')), 11)}` +
          `${pad(asMs(statOf(data, 'step_listings_index', label, 'p(95)')), 14)}` +
          `${pad(asMs(statOf(data, 'step_listing_detail', label, 'p(95)')), 12)}` +
          `${pad(asMs(statOf(data, 'iteration_duration', label, 'p(95)')), 10)}`);
      }
      const dropped = data.metrics.dropped_iterations;
      lines.push(`  dropped iterations: ${dropped ? dropped.values.count : 0}` +
        `   login failures: ${data.metrics.login_failures ? data.metrics.login_failures.values.count : 0}`);
      lines.push('');
      return lines.join('\n');
    }

    export function handleSummary(data) {
      const out = {
        host: HOST,
        generators: GENERATORS,
        steps: STEPS,
        labels: STAIR_LABELS,
        ramp_s: RAMP_S,
        hold_s: HOLD_S,
        metrics: {},
      };
      for (const key of Object.keys(data.metrics)) {
        out.metrics[key] = data.metrics[key].values;
      }
      // One line, one JSON object, so twelve pod logs can be parsed
      // without caring what else k6 printed around it.
      return {
        stdout: humanTable(data) +
          '\nJOURNEY_SUMMARY_JSON ' + JSON.stringify(out) + '\n',
      };
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-journey
  namespace: laravel-spa
spec:
  # TWELVE generators, deliberately more than the 8 threads on the box.
  #
  # The narrow reasoning says use fewer: they all share loadgen's 16 GB,
  # so extra processes spend memory on Go runtimes instead of virtual
  # users, and 12 runtimes on 8 cores contend. Both true, and both minor
  # -- about 800 MB, or 6-12 arrivals/sec of reach.
  #
  # What overrides them is how the traffic is SHAPED, which an earlier
  # run already demonstrated: spread-out arrivals behave differently from
  # arrivals queued behind one another, and the queueing happens inside
  # the GENERATOR, not on the site.
  #
  # Each k6 process keeps its own HTTP connection pool. Over TLS to
  # Traefik those are HTTP/2 connections, where many requests multiplex
  # over a handful of TCP sockets subject to a per-connection stream
  # limit. Four processes is four pools and a small total stream budget,
  # so requests wait for a free stream before they are even sent -- and
  # k6 clocks that wait as SERVER latency, because its timer starts when
  # the request is queued, not when it goes out. Twelve processes is
  # twelve pod IPs, twelve pools, 3x the concurrent streams and 3x the
  # ephemeral port space (~28k per source IP, which binds once TIME_WAIT
  # accumulates at high rates).
  #
  # So this is not about using more of the machine: with no requests and
  # no limits, any pod count uses all of it. It is about not fabricating
  # latency inside the measuring instrument -- the same error as running
  # generators on the nodes under test, which this box exists to end.
  #
  # GOMAXPROCS=2 below is what makes 12 affordable. Without it each
  # process sees 8 CPUs and starts 8 scheduler threads, so 12 pods would
  # run ~96 threads over 8 cores. Pinned at 2 it is 24, which the kernel
  # absorbs without thrashing, and no throughput is lost because only 8
  # can run at once regardless.
  #
  # GENERATOR COUNT IS LOAD-BEARING: every per-generator rate below is an
  # ABSOLUTE rate, not a share of a total, so changing `parallelism`
  # without rescaling them changes the load the test applies.
  parallelism: 12
  completions: 12
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6-journey
    spec:
      restartPolicy: Never
      # The dedicated generator box, and nowhere else.
      #
      # This used to list five cluster nodes and spread generators across
      # them, which was the best available answer when there was nowhere
      # else to put them -- but it meant the measuring instrument always
      # shared cores with the thing being measured. k27 and u4h between
      # them hosted 21 of the 24 pods under test, so a generator landing
      # on either took CPU from the site and understated its capacity by
      # an amount nobody could quantify.
      #
      # `loadgen` (192.168.100.102) carries nothing else: labelled
      # workload=loadtest, tainted dedicated=loadtest:NoSchedule. The
      # selector finds it; the taint keeps app pods, Longhorn and the
      # exporters away. The toleration is what lets THESE pods past the
      # taint -- drop it and they sit Pending forever.
      #
      # The spread constraint is gone with the multi-node list: there is
      # one eligible node, so there is nothing to spread across.
      nodeSelector:
        workload: loadtest
      tolerations:
        - key: dedicated
          operator: Equal
          value: loadtest
          effect: NoSchedule
      containers:
        - name: k6
          image: grafana/k6:latest
          # WHY THE EXIT CODE IS THROWN AWAY.
          #
          # k6 exits 99 when a threshold is crossed, and crossing one is
          # the expected outcome of a run whose purpose is to find the
          # breaking point. With `backoffLimit: 0` the first generator to
          # exit 99 fails the Job, and the Job controller then deletes the
          # eleven still-running pods -- mid-summary, taking their results
          # with them. That is how the 2026-10-15 run came back with one
          # generator's numbers (23,062 requests, 21/s) instead of twelve,
          # and nothing in the output said so.
          #
          # The verdict of a load test is in the summary, not the exit
          # code, so k6's is reported and discarded.
          command:
            - sh
            - -c
            - k6 run /scripts/journey.js; echo "k6 exit=$?"; exit 0
          env:
            # Pinned, and load-bearing at 12 generators -- see the note on
            # `parallelism`. Without it each k6 process sees all 8 CPUs
            # and starts 8 scheduler threads.
            - name: GOMAXPROCS
              value: "2"
            # STREAM THE RESULTS OUT WHILE THE RUN IS HAPPENING.
            #
            # A generator's summary used to exist only inside its own
            # process until the very end, so a generator that died took
            # its results with it -- and at the top of a staircase that
            # climbs past what the box can carry, dying is the EXPECTED
            # outcome. k6 pushes to Prometheus every 5 seconds instead, so
            # a generator killed at step 7 still leaves steps 1-6 intact.
            #
            # It also fixes the merge: as native histograms the twelve
            # generators' latencies are additive, so a site-wide p95 is
            # the real quantile of all of it rather than the median of
            # twelve separate estimates.
            - name: K6_OUT
              value: experimental-prometheus-rw
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM
              value: "true"
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: 5s
            - name: K6_PROMETHEUS_RW_STALE_MARKERS
              value: "true"
            # Twelve generators writing one Prometheus need to be
            # distinguishable, or they all write the same series and the
            # collisions are dropped as duplicate samples. See the `tags`
            # option in the script.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TARGET_HOST
              value: "www.foasfo.ca"
            - name: LB_IP
              value: "192.168.100.200"
            - name: AUTH
              valueFrom:
                secretKeyRef:
                  name: loadtest-credentials
                  key: BASIC_AUTH
            # Total peak arrivals/sec across all personas, per generator.
            # Only used when STAIR_STEPS is cleared. 12 x 67 = 804/sec
            # site-wide, matching the eight-generator arrangement's 800.
            # This is arrivals, not concurrency, so it is NOT comparable
            # to the old VUS_PER_POD numbers.
            - name: PEAK_ARRIVALS
              value: "67"
            # Scaled by 8/12, because the generator count went 8 -> 12.
            # These are per-generator ABSOLUTE rates, not shares of a
            # total, so leaving them alone would have raised the
            # site-wide write load by half and changed what the test
            # measures. Site-wide they are unchanged: 8/s saves, 4/s
            # enquiries, ~1 ad every 3s, ~1 yard sale every 12s.
            #
            # STILL OUTSTANDING, deliberately not changed here: 0.32 ads/s
            # site-wide is 27,600 a day against a real expectation of
            # ~300. Fixing that in the same run as the rig move would
            # leave no way to tell which change moved the numbers, so it
            # waits. The value for 300/day is RATE_POSTER=0.00058 at 12
            # generators.
            - name: RATE_SAVER
              value: "0.667"
            - name: RATE_ENQUIRER
              value: "0.333"
            - name: RATE_POSTER
              value: "0.0267"
            - name: RATE_YARDSALER
              value: "0.00667"
            - name: RECAPTCHA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loadtest-credentials
                  key: RECAPTCHA_LOAD_TEST_TOKEN
            # The stable target for the "returning checker" persona,
            # created by `php artisan loadtest:seed` (which prints the
            # id). Also the fallback when a page scrape finds no listing.
            - name: KNOWN_LISTING
              value: "100069"
            # Scales the whole timeline. '1m' is the full ~14 minute run;
            # '10s' gives the identical ramp shape in ~2.5 minutes, for
            # verifying the personas work before committing to a long run.
            # Staircase: per-generator arrival rates, each approached then
            # HELD so latency settles and every step is judged on its own.
            # Clear STAIR_STEPS to fall back to the original ramp.
            #
            # Twelve generators, so site-wide this is
            # 48/72/96/120/144/168/192 per second. Integers per generator
            # on purpose -- k6 arrival rates are integers, and 12 does not
            # divide 40/80/120/160 evenly, so chasing the old figures
            # exactly would have meant rounding each step and reporting a
            # rate the test never ran. 192 sits just under the last
            # known-good 200.
            #
            # SEVEN steps rather than four, over the same span. The
            # 2026-10-15 run used 48/96/144/192 and its finding was that
            # the knee is "somewhere between 48 and 192" -- a 4x band,
            # which is not an answer. 24-arrival/sec steps halve the
            # resolution of that band, and because every sample now
            # carries the step it was taken in, one run reads the whole
            # curve instead of needing a bisecting run per guess.
            #
            # Cost: 7 x 3m30s = 24m30s instead of 14m. Generator memory
            # is unchanged, because pre-allocation is sized by the
            # TALLEST step (16/generator) and that has not moved.
            #
            # The top step is set by the generator's memory, and the
            # arithmetic is worth writing down because this is now the
            # ceiling that binds:
            #
            #   journey VU            2.12 MB  (measured: 2.9GB / 1,366 VUs)
            #   loadgen usable RAM    ~14 GB   (16 less Talos + kubelet)
            #   12 Go runtimes        ~0.8 GB
            #   -> concurrent VUs     ~6,200
            #   sessions last ~30s, so each sustained arrival/sec needs
            #   ~30 concurrent VUs
            #   -> ~205 arrivals/sec, and 192 keeps a margin
            #
            # So the rig can no longer out-drive the site: ~200/sec is
            # both the last known-good site figure AND roughly this box's
            # limit. Past the knee VU demand is unbounded -- the site
            # slows, sessions stop completing, and k6 needs ever more VUs
            # to hold the rate -- so at the top step a degrading site
            # will OOM the generator before its failure is characterised.
            #
            # That is the honest limit of this box, and it is a RAM limit:
            # not CPU, not the NIC, not the pod count. loadgen has two
            # free DIMM slots and takes 64 GB. At 48 GB the ceiling moves
            # to roughly 600 arrivals/sec, which is the headroom needed
            # to find the SITE's next breaking point instead of the rig's.
            # 48/90/132/174/216/258/300 arrivals/sec site-wide.
            #
            # The top two steps are BEYOND WHAT THIS BOX CAN GENERATE, and
            # that is a deliberate choice rather than an oversight. The
            # rig's own ceiling is ~200/sec: a visitor costs 2.12 MB of
            # generator memory, sessions last 17-31s, so 300/sec needs
            # 5,200-9,500 concurrent VUs, i.e. 11-20 GB on a box with
            # ~13.5 GB usable.
            #
            # Running into that knowingly is worth it now only because the
            # results no longer die with the generators (see K6_OUT
            # above). Steps 1-5 are inside the rig's budget and measure the
            # SITE. Steps 6-7 measure the RIG failing, which is itself the
            # measurement that says what the box needs -- and anything
            # they report about latency is the generator's own memory
            # pressure, not the site's.
            #
            # Fractional per-generator rates are fine now that read rates
            # are expressed per minute: 7.5/gen is exactly 450/minute.
            - name: STAIR_STEPS
              value: "4,7.5,11,14.5,18,21.5,25"
            # Pre-allocate for the tallest HEALTHY step (16/gen = 192/sec
            # site-wide), not for the 25/gen ceiling -- pre-allocating for
            # 25 would claim 12.7 GB at startup and be OOM-killed before
            # the first step. See VU_BUDGET in the script.
            - name: VU_BUDGET
              value: "16"
            # Labels only: per-generator rate x GENERATORS is the
            # site-wide rate the results are quoted in. Must match
            # `parallelism` above or the table is mislabelled -- it does
            # not change the load applied.
            - name: GENERATORS
              value: "12"
            - name: STAIR_HOLD
              value: "3m"
            - name: STAIR_RAMP
              value: "30s"
            # Zero server requests per category click, which is what the
            # site actually does today. See viewSubcategory().
            - name: SUBCATEGORY_REQUESTS
              value: "false"
            - name: RAMP_UNIT
              value: "1m"
            # Must span the whole staircase -- 7 steps x (30s ramp + 3m
            # hold) = 24m30s -- or the write personas stop partway and the
            # taller steps get measured without them, which would make the
            # top of the curve quietly easier than the bottom.
            - name: WRITE_DURATION
              value: "26m"
            - name: ACCOUNT_COUNT
              value: "200"
            - name: ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loadtest-credentials
                  key: ACCOUNT_PASSWORD
            - name: PHOTO_KB
              value: "200"
          volumeMounts:
            - name: script
              mountPath: /scripts
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
      volumes:
        - name: script
          configMap:
            name: k6-journey-script
