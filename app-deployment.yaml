apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-spa-app
  namespace: laravel-spa
spec:
  # 16 -> 24 on 2026-10-13. Honest note on what this bought: very
  # little. It took FPM workers from 3,200 to 4,800 and moved throughput
  # only ~4% (516 -> 538 req/s), while the failure rate went slightly
  # *up* (6.56% -> 7.72%). The p95 did improve (7.58s -> 5.54s).
  #
  # That result is what ruled out worker count as the bottleneck: if
  # each request spends a fixed time waiting (DNS, see dnsConfig below),
  # more workers just means more requests waiting in parallel, not any
  # of them finishing sooner. Kept at 24 because the extra headroom and
  # better tail are worth having, but it is not the fix for anything.
  replicas: 24
  selector:
    matchLabels:
      app: laravel-spa-app
  template:
    metadata:
      labels:
        app: laravel-spa-app
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Kubernetes' default is ndots:5, which means any hostname with
      # fewer than 5 dots is tried against the search list FIRST, before
      # being tried as written. redis.laravel-spa.svc.cluster.local has
      # four, so every single connection to it attempted
      #   redis.laravel-spa.svc.cluster.local.laravel-spa.svc.cluster.local
      #   redis.laravel-spa.svc.cluster.local.svc.cluster.local
      #   redis.laravel-spa.svc.cluster.local.cluster.local
      # (all NXDOMAIN) before the real name — and glibc doubles each with
      # a parallel AAAA lookup. Eight DNS queries per Redis connection,
      # and PHP caches nothing between requests.
      #
      # Measured 2026-10-13: CoreDNS had served 79 MILLION queries per
      # pod, was burning 2.26 cores, and one replica averaged 8.07ms per
      # query (vs 0.41ms on the other). Every one of those milliseconds
      # is a synchronous wait inside a page load.
      #
      # ndots:1 makes any dotted name be tried as written first. Nothing
      # the app talks to relies on search-list expansion.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: app
          # FROZEN 2026-10-13 as the control side of the A/B against
          # laravel-spa-app-clone (see app-clone.yaml).
          #
          # This was `:latest` with imagePullPolicy: Always, which meant
          # any pod restart pulled whatever :latest currently resolved
          # to. With a variant being built and pushed to the same tag,
          # the control would silently adopt the change on its next
          # restart and both measurements would be void -- and nothing
          # would look wrong while it happened.
          #
          # A digest is immutable, so this tier now cannot drift
          # regardless of what CI publishes. The clone stays on :latest
          # and picks changes up.
          #
          # To unfreeze, put `:latest` back and roll the deployment.
          # PROMOTED 2026-10-19: this digest is the clone, after it held
          # 72 sessions/sec for three and a half days with home p95 pinned
          # at 0.090s, zero failures and zero drift. It carries
          # per-category browse, the listing-expiry work and the prune
          # cache fixes.
          #
          # Still a digest, and still for the original reason: a floating
          # tag means an overnight registry push changes production with
          # nothing in the manifest to show it. The clone stays on
          # :latest and picks up each build; promoting is the deliberate
          # act of moving this line.
          image: ghcr.io/123xtd/laravel-spa-app@sha256:2337b918222a513bd89d91ecb840872dddcd987f172df57ab7a2914a63c53bef
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: laravel-spa-secrets
          # An explicit `env` entry overrides the same key from
          # `envFrom`, so this corrects REDIS_HOST without editing the
          # shared secret. The trailing dot makes the name absolute,
          # which skips the search list regardless of ndots -- belt and
          # braces alongside the dnsConfig above.
          env:
            # What the browser tab says. Deliberately NOT APP_NAME:
            # config/mail.php falls back to APP_NAME for the outgoing
            # email sender name, and TwoFactorAuthenticationService
            # passes it as the issuer shown in people's authenticator
            # apps. Renaming the tab should rename neither.
            #
            # This is an `env` entry while APP_NAME arrives via
            # `envFrom`, and that is load-bearing: env takes precedence
            # over envFrom, which is how this wins without editing the
            # shared secret both app tiers read.
            #
            # Shared to the frontend as the `tabName` prop, so one image can
            # serve both tiers under different names. Do NOT move this to
            # VITE_APP_NAME: vite resolves that at build time, so both
            # tiers would get whichever name was built, and that is how
            # the tab ended up saying "Laravel" in the first place.
            #
            # This value is the real site: a label a visitor will recognise in
            # their bookmarks and history a month from now.
            - name: APP_TAB_NAME
              value: "Buy and Sell Page"
            - name: REDIS_HOST
              value: redis.laravel-spa.svc.cluster.local.
            # The root cause behind most 500s under load. With
            # persistent=false (Laravel's default), every PHP request
            # opens and tears down its own Redis connection -- and
            # since sessions AND cache are both on Redis, that is at
            # least one connect per page view, each needing a fresh DNS
            # resolution because PHP caches nothing between requests.
            #
            # At ~1,400 req/s that overwhelmed CoreDNS, and the logs
            # (2026-10-13, 250k+ lines on the hot pods) showed exactly
            # what followed:
            #   php_network_getaddresses: getaddrinfo for
            #     redis.laravel-spa.svc.cluster.local. failed: Try again
            #   RedisException: Operation timed out
            # That Redis connect timeout is the ~5.0-5.3s wall seen on
            # every failing request across runs 7, 8 and 9.
            #
            # true makes phpredis reuse one connection per worker
            # process, so connects and DNS lookups drop to roughly zero.
            # Watch Redis client count after changing this: one per
            # worker, so 24 pods x 200 children = 4,800 against redis
            # maxclients (default 10,000).
            - name: REDIS_PERSISTENT
              value: "true"
            # THE PAGE CACHE, which this tier has never had.
            #
            # It was the A/B control, so it ran with the cache off while
            # the clone ran with it on. Measured before it existed: the
            # home page cost 27 queries and ~83 KB of freshly serialised
            # JSON on every single load, and four consecutive loads
            # produced byte-identical output.
            - name: PAGE_CACHE_ENABLED
              value: "true"
            - name: PAGE_CACHE_PATHS
              value: "/,/listings,/post,/terms,/privacy,/cookies,/accessibility,/about"
            # EXPLICIT, AND DISTINCT FROM THE CLONE'S.
            #
            # Both tiers share one Dragonfly. The clone uses db2 and db3;
            # unset, Laravel defaults to 0 and 1, so they do not collide
            # today -- but only by accident of the defaults. Naming them
            # means a future change to the shared secret cannot quietly
            # put test traffic into live sessions.
            - name: REDIS_DB
              value: "0"
            - name: REDIS_CACHE_DB
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
---
# THE LIVE TIER HAD NO AUTOSCALER AT ALL.
#
# It was the A/B control, fixed at 24 replicas so the comparison was not
# confounded by scaling. Going live, that is no longer a feature: a fixed
# fleet cannot absorb anything the floor does not already cover.
#
# Mirrors the clone's, which is what the three-and-a-half-day run
# exercised. Two things worth knowing about it, both measured here:
#
#   - The floor is the number that matters. A burst lands in seconds and
#     a pod needs ~30s to start and warm, so whatever the floor happens
#     to be IS the burst capacity. 24 idle pods cost ~1.2 cores and 12Gi.
#
#   - AverageValue, not Utilization: with no resource requests there is
#     nothing to take a percentage OF, and the HPA would report <unknown>
#     forever and never scale.
#
# And the known limitation, which no HPA setting fixes: CPU cannot see an
# I/O stall. The home page hit a 10.79s p95 while this metric sat idle,
# because the pods were waiting rather than computing. That is what the
# latency alerting is for, not this.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-spa-app
  namespace: laravel-spa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel-spa-app
  minReplicas: 24
  # 40 rather than the clone file's 200: 40 is what has actually been
  # exercised. Raising it is a deliberate decision to take once real
  # traffic says something about where this tier sits.
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 500m
  behavior:
    # Asymmetric on purpose: scaling up late costs users their page,
    # scaling down late costs a few idle pods.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 8
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Max
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-spa-app
  namespace: laravel-spa
spec:
  selector:
    app: laravel-spa-app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-spa-ssr
  namespace: laravel-spa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-spa-ssr
  template:
    metadata:
      labels:
        app: laravel-spa-ssr
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ssr
          image: ghcr.io/123xtd/laravel-spa-ssr:latest
          ports:
            - containerPort: 13714
          envFrom:
            - secretRef:
                name: laravel-spa-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-spa-ssr
  namespace: laravel-spa
spec:
  selector:
    app: laravel-spa-ssr
  ports:
    - port: 13714
      targetPort: 13714
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: laravel-spa-http
  namespace: laravel-spa
spec:
  entryPoints:
    - web
  routes:
    - match: >-
        Host(`buyandsellpage.com`) || Host(`www.buyandsellpage.com`) ||
        Host(`buyandsellpage.ca`) || Host(`www.buyandsellpage.ca`)
      kind: Rule
      services:
        - name: laravel-spa-app
          port: 80
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: laravel-spa
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www-to-apex
  namespace: laravel-spa
spec:
  # Strip a leading "www." for any host — works for both .com and .ca.
  redirectRegex:
    regex: ^https?://www\.(.+)
    replacement: https://${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: laravel-spa-https
  # Promotion log (the digest itself lives on the Deployment above).
  # Each one was validated on the clone first, as every promotion should be.
  #   2026-10-21  7040efd0  right-aligned container labels; ticker no
  #                         longer scrolling blank space
  #   2026-10-21  2ebf41cf  mobile text wrapping on every starship --
  #                         measured clean at 375/390/768 on both
  #                         hostnames; .npmrc now honoured in the builds
  #
  # WENT LIVE 2026-10-20. Both routes pointed at maintenance-page until
  # now; apex and www now serve the app.
  #
  # True at the moment of the switch: this tier runs the digest that held
  # 72 sessions/sec for three and a half days with home p95 pinned at
  # 0.090s; the page cache is on; an HPA exists; the database holds one
  # real account and two real listings after 243 synthetic accounts and
  # 97,924 seeded listings were removed; alerting delivers to Discord,
  # verified by sending real alerts rather than assuming; and all three
  # production hostnames were checked against the app directly, returning
  # 200 with the per-category payload and the correct region split.
  #
  # To put the maintenance page back: change these two services to
  # maintenance-page and apply. Nothing else moves.
  namespace: laravel-spa
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`buyandsellpage.com`) || Host(`buyandsellpage.ca`)
      kind: Rule
      services:
        - name: laravel-spa-app
          port: 80
    - match: Host(`www.buyandsellpage.com`) || Host(`www.buyandsellpage.ca`)
      kind: Rule
      services:
        - name: laravel-spa-app
          port: 80
      middlewares:
        - name: redirect-www-to-apex
  tls:
    secretName: buyandsellpage-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: buyandsellpage-cert
  namespace: laravel-spa
spec:
  secretName: buyandsellpage-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - buyandsellpage.com
    - www.buyandsellpage.com
    - buyandsellpage.ca
    - www.buyandsellpage.ca
