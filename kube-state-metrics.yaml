# kube-state-metrics: the Kubernetes control plane's own state, as metrics.
#
# WHY THIS EXISTS
#
# The cluster is set up to scale without supervision -- HPAs on the app
# (24-40 replicas) and on Traefik (3-12) -- and the agreement is that a
# human is not watching for traffic spikes; a daily report or an
# emergency alert is. For that to work, the one alert that genuinely
# needs a human is "the autoscalers have run out of room, buy hardware."
#
# That alert is:
#
#   kube_horizontalpodautoscaler_status_current_replicas
#     >= kube_horizontalpodautoscaler_spec_max_replicas
#
# Both series come from here, and NEITHER existed: Prometheus had no
# kube_* metrics at all, because kube-state-metrics was never deployed.
# So the autoscalers were live and working with nothing watching whether
# they had hit their ceiling. Every HPA, deployment, pod-state and
# node-condition panel in Grafana was blank for the same reason.
#
# This is NOT node-exporter's job and does not overlap with it.
# node-exporter reports what a machine is doing (CPU, memory, NIC);
# this reports what Kubernetes has DECIDED (replica counts, scheduling
# state, conditions). The "add hardware" signal lives in the second.
#
# Scraped by the existing `kubernetes-pods` job via the annotations
# below, which is the same mechanism node-exporter uses -- so no change
# to prometheus-config and no Prometheus restart is needed.
#
# It carries no toleration for dedicated=loadtest:NoSchedule, so it can
# never land on the generator box. It also talks only to the API server,
# which runs on the three control planes -- none of which carry app
# pods -- so it adds no load to the nodes under test.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  # Read-only throughout. Scoped to the objects whose state is actually
  # reported on, rather than a blanket wildcard: autoscaling first,
  # because that is the reason this is being installed.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - endpoints
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses", "ingressclasses"]
    verbs: ["list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
      annotations:
        # Picked up by the existing `kubernetes-pods` scrape job, which
        # keeps any pod carrying prometheus.io/scrape=true and reads the
        # port from prometheus.io/port. 8080 is the metrics port; 8081 is
        # kube-state-metrics' own telemetry and is deliberately not
        # scraped.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kube-state-metrics
      # No toleration for dedicated=loadtest:NoSchedule, so this can
      # never be scheduled onto the generator box.
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
          args:
            - --port=8080
            - --telemetry-port=8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          # No requests, no limits -- cluster policy. Nothing is reserved
          # and nothing is capped; placement and scaling belong to
          # Kubernetes rather than to hand-picked numbers.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  clusterIP: None
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
    - name: telemetry
      port: 8081
      targetPort: 8081
