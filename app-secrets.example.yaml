# TEMPLATE. Copy to app-secrets.yaml and fill in real values:
#   cp app-secrets.example.yaml app-secrets.yaml
#   $EDITOR app-secrets.yaml
#   kubectl apply -f app-secrets.yaml
#
# app-secrets.yaml is gitignored. Keys are listed here so the shape
# is reproducible; values are not.
apiVersion: v1
kind: Secret
metadata:
  name: laravel-spa-secrets
  namespace: laravel-spa
type: Opaque
stringData:
  APP_NAME: "CHANGEME"
  APP_ENV: "CHANGEME"
  APP_KEY: "CHANGEME"
  APP_DEBUG: "CHANGEME"
  APP_URL: "CHANGEME"

  LOG_CHANNEL: "CHANGEME"
  LOG_LEVEL: "CHANGEME"

  DB_CONNECTION: "CHANGEME"
  DB_HOST: "CHANGEME"
  DB_PORT: "CHANGEME"
  DB_DATABASE: "CHANGEME"
  DB_USERNAME: "CHANGEME"
  DB_PASSWORD: "CHANGEME"

  SESSION_DRIVER: "CHANGEME"
  CACHE_STORE: "CHANGEME"
  QUEUE_CONNECTION: "CHANGEME"
  REDIS_HOST: "CHANGEME"
  REDIS_PORT: "CHANGEME"

  FILESYSTEM_DISK: "CHANGEME"
  AWS_ACCESS_KEY_ID: "CHANGEME"
  AWS_SECRET_ACCESS_KEY: "CHANGEME"
  AWS_DEFAULT_REGION: "CHANGEME"
  AWS_BUCKET: "CHANGEME"
  AWS_ENDPOINT: "CHANGEME"
  AWS_USE_PATH_STYLE_ENDPOINT: "CHANGEME"

  # AWS SES — separate credentials from the S3/MinIO ones above.
  # IAM user "laravel-spa-ses", scoped to ses:SendEmail/ses:SendRawEmail only.
  MAIL_MAILER: "CHANGEME"
  MAIL_FROM_ADDRESS: "CHANGEME"
  MAIL_FROM_NAME: "CHANGEME"
  SES_ACCESS_KEY_ID: "CHANGEME"
  SES_SECRET_ACCESS_KEY: "CHANGEME"
  SES_REGION: "CHANGEME"

  # Google reCAPTCHA v3 — real account keys, covering
  # buyandsellpage.ca/.com, foasfo.ca/.com, ba-sp.com. Replaced hCaptcha
  # (and before that, Cloudflare Turnstile) after its challenge
  # infrastructure proved unreliable for a real user in production.
  RECAPTCHA_SITE_KEY: "CHANGEME"
  RECAPTCHA_SECRET_KEY: "CHANGEME"
