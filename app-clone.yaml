# A full clone of the app tier, for A/B testing changes against the real
# site under identical conditions.
#
# Built 2026-10-13. The capacity work up to that point compared load-test
# runs taken hours apart, with the cluster in different states each time
# -- fine for finding order-of-magnitude problems, useless for judging a
# change worth a few percent. This lets a change be measured against an
# unmodified control on the same hardware, with the same data, through
# the same ingress.
#
#   real site : https://foasfo.ca      -> laravel-spa-app        (control)
#   clone     : https://www.foasfo.ca  -> laravel-spa-app-clone  (variant)
#
# What is shared, deliberately, so the comparison is fair:
#   - the same MySQL database. Both hosts end in something other than
#     ".com", so Region::current() resolves both to 'ca' and they see
#     the identical 68,062 listings. The read path under test does not
#     write, so sharing is safe.
#   - the same Traefik, the same TLS certificate (www.foasfo.ca is
#     already a SAN on it), the same basic-auth middleware. Identical
#     network path end to end.
#   - the same image, resources and replica count.
#
# What is isolated, so the two cannot contaminate each other:
#   - Redis database indexes. The clone uses 2 and 3 where the real site
#     uses 0 and 1, so sessions and cache are entirely separate. Without
#     this, a cache fix on the clone would silently serve the real site
#     too and both measurements would be meaningless.
#
# Run load tests SEQUENTIALLY, never both at once -- they share the
# cluster, the database and the ingress, so concurrent runs would
# measure contention rather than the change. Idle pods cost ~50m each,
# so leaving both deployments up between runs is cheap.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-spa-app-clone
  namespace: laravel-spa
spec:
  # Matches the real tier exactly. If one side has more capacity than
  # the other, the comparison measures the replica count, not the change.
  # The HPA owns this once it exists (see the HorizontalPodAutoscaler at
  # the end of this file), so this value only applies before the HPA's
  # first reconcile. Kept at the old fixed count so a fresh apply does
  # not start the site at the floor.
  replicas: 24
  selector:
    matchLabels:
      app: laravel-spa-app-clone
  template:
    metadata:
      labels:
        app: laravel-spa-app-clone
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Same DNS treatment as the real tier -- see app-deployment.yaml
      # for why ndots:5 was costing 8 lookups per Redis connection.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: app
          image: ghcr.io/123xtd/laravel-spa-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: laravel-spa-secrets
          env:
            # What the browser tab says. Deliberately NOT APP_NAME:
            # config/mail.php falls back to APP_NAME for the outgoing
            # email sender name, and TwoFactorAuthenticationService
            # passes it as the issuer shown in people's authenticator
            # apps. Renaming the tab should rename neither.
            #
            # This is an `env` entry while APP_NAME arrives via
            # `envFrom`, and that is load-bearing: env takes precedence
            # over envFrom, which is how this wins without editing the
            # shared secret both app tiers read.
            #
            # Shared to the frontend as the `tabName` prop, so one image can
            # serve both tiers under different names. Do NOT move this to
            # VITE_APP_NAME: vite resolves that at build time, so both
            # tiers would get whichever name was built, and that is how
            # the tab ended up saying "Laravel" in the first place.
            #
            # This value is the clone and test domains, which are password-walled
            # and developer-facing -- the insider name goes where the
            # insiders are, and it makes it obvious at a glance which
            # site a tab belongs to when both are open.
            - name: APP_TAB_NAME
              value: "Basp-Spa"
            - name: REDIS_HOST
              value: redis.laravel-spa.svc.cluster.local.
            - name: REDIS_PERSISTENT
              value: "true"
            # The isolation that makes this a clone rather than a second
            # copy of the same thing. Real site: 0 (sessions) and 1
            # (cache). Clone: 2 and 3.
            - name: REDIS_DB
              value: "2"
            - name: REDIS_CACHE_DB
              value: "3"
            # Server-side rendering, ON here and nowhere else yet.
            #
            # The SSR tier has been running since before go-live without
            # ever being asked for anything. There is no
            # config/inertia.php and this variable was never set, so the
            # package default applied -- enabled true, url
            # http://127.0.0.1:13714 -- and the app dialled its OWN pod,
            # where nothing listens. Proven from inside an app pod on
            # 2026-10-27: 127.0.0.1:13714 is connection-refused while
            # laravel-spa-ssr:13714 answers 200. Inertia catches that and
            # falls back to client rendering, which is why nobody noticed.
            #
            # Pointed at the service, the tier finally serves. On the
            # clone first, because a mismatch between the SSR bundle and
            # the client bundle shows up as hydration errors rather than
            # as a clean failure.
            - name: INERTIA_SSR_URL
              value: http://laravel-spa-ssr:13714
            # The SECOND reason SSR never ran, and the quieter one.
            #
            # Inertia only dispatches to the SSR server if it can also
            # find an SSR bundle ON DISK in this container -- it looks
            # for bootstrap/ssr/ssr.mjs, bootstrap/ssr/ssr.js or
            # public/js/ssr.js. The app image ships none of them; the
            # bundle lives in the laravel-spa-ssr image, which is the
            # whole point of that tier being separate. So the check
            # failed, dispatch was skipped, and nothing was logged
            # anywhere: no error, no request, no clue.
            #
            # Turning the check off is the right answer here rather than
            # copying the bundle into the app image: the app does not
            # execute it, it only needs to know the renderer is out
            # there, and that is what the health check and the readiness
            # probe on the SSR tier are for.
            - name: INERTIA_SSR_ENSURE_BUNDLE_EXISTS
              value: "false"
            # THE VARIANT UNDER TEST. Set here and nowhere else, so the
            # two tiers run identical code and differ only by this flag
            # -- which is what makes the comparison attributable to the
            # change rather than to any drift between them.
            #
            # See config/pagecache.php. Off by default in config, so the
            # real site stays unaffected even if it is ever unfrozen.
            - name: PAGE_CACHE_ENABLED
              value: "true"
            # '/' is the expensive one (28 queries, ~83 KB). The rest are
            # already query-free -- their props are static PHP arrays or
            # nothing at all -- so caching them saves render and
            # serialisation cost, not database work. /post is still worth
            # it at ~55 KB per load.
            #
            # /listings is included now: only the BARE path is ever stored,
            # because CacheGuestPage declines any request with a query
            # string, so ?q=, ?category= and ?page= still go to the
            # database. That is fine -- measured 2026-10-13, a filtered
            # page costs the same ~46 ms / 2 queries as an unfiltered one,
            # since the expensive part was the COUNT(*) and RouteData
            # caches that separately. The bare path is the one the nav
            # links to, so it is the one worth storing.
            #
            # Deliberately NOT included: anything behind auth middleware,
            # which can never be shared between visitors.
            - name: PAGE_CACHE_PATHS
              value: "/,/listings,/post,/terms,/privacy,/cookies,/accessibility,/about"
            # Lets the journey load test exercise ad posting without every
            # submission calling Google (which would measure Google's
            # latency and get rate-limited). Must match RECAPTCHA_TOKEN in
            # k8s/k6-journey-job.yaml.
            #
            # This is NOT a switch that disables recaptcha: only a
            # submission carrying this exact token skips verification, so
            # real bot protection stays intact even here. See
            # app/Rules/Recaptcha.php and the adversarial tests in
            # tests/Feature/RecaptchaLoadTestTokenTest.php.
            #
            # NEVER set this on the real site (laravel-spa-app). It also
            # gates `php artisan loadtest:seed`, which refuses to create
            # bulk fake accounts without it.
            - name: RECAPTCHA_LOAD_TEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loadtest-credentials
                  key: RECAPTCHA_LOAD_TEST_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-spa-app-clone
  namespace: laravel-spa
spec:
  selector:
    app: laravel-spa-app-clone
  ports:
    - port: 80
      targetPort: 8080
---
# Scale the app tier on demand, so a traffic spike is absorbed without
# anyone watching.
#
# WHY CPU IS THE TRIGGER
# HPA measures utilisation against the REQUEST, not the limit. The
# request is 400m and a pod under load draws ~540m, so load shows up as
# ~135% utilisation and this fires decisively. That is also why the
# request is deliberately below peak usage: a request sized to guarantee
# peak would read as 100% utilisation at full load and never scale.
#
# WHAT THIS CANNOT DO
# A pod takes tens of seconds to start and warm. This absorbs SUSTAINED
# load -- a busy evening, a traffic ramp -- but it cannot react to an
# instantaneous burst. Measured 2026-10-14: 2,000 simultaneous arrivals
# drain in ~5 seconds, which is over before a new pod is ready. Bursts
# are absorbed by the page cache and by headroom in the running pods,
# not by this. Horizontal scaling is not a substitute for the floor
# being high enough.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-spa-app-clone
  namespace: laravel-spa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel-spa-app-clone
  # Floor of 24, and the floor is the number that matters.
  #
  # Measured 2026-10-14: a burst of 10,000 simultaneous arrivals landed
  # while the HPA had scaled this down to 9 pods during an idle period.
  # It served 99.3% of them but at a 24-second median. The same burst
  # against 24 pods served 97.8% at a 16-second median. Scaling cannot
  # help here -- a burst lands in seconds and a pod needs ~30s to start
  # and warm -- so whatever the floor happens to be IS the burst
  # capacity.
  #
  # An idle pod costs ~50m of CPU and ~500Mi, so 24 of them is ~1.2
  # cores and 12Gi on a cluster with 83 cores and 67Gi. That is a cheap
  # price for not having the first 10,000 visitors of a spike meet a
  # third of the fleet.
  minReplicas: 24
  # CEILING RESTORED TO 40 (2026-10-21), matching the cluster.
  #
  # Everything below this paragraph is the reasoning for having had NO
  # ceiling. It is kept because the arithmetic is still true and still
  # useful -- but its premise is not. It was written to discover the
  # hardware's capacity, and capacity testing has since been retired
  # for good; volume monitoring decides what hardware to add now.
  #
  # What changed is who else is on these nodes. When that note was
  # written the cluster was a test rig. It now serves the live site,
  # and this clone shares the same five untainted workers. The note's
  # own closing observation -- no resource requests anywhere, so the
  # scheduler has no basis on which to refuse a pod -- was an accepted
  # experimental condition then. With live traffic on the same cores it
  # is a way for the clone to starve the real site, and no alert would
  # attribute the damage here.
  #
  # So the binding constraint is deliberately a number again. 40 is the
  # live app's own ceiling, the clone is idle (1m/500m against 24 pods),
  # and nothing is scheduled that needs more. Raise it deliberately, with
  # resource requests added at the same time, if a test ever needs it.
  #
  # ---- the original note, retained ----
  #
  # NO CEILING, in the only sense Kubernetes permits one to be absent.
  #
  # maxReplicas is a required field -- an HPA cannot be written without
  # it -- so "no cap" has to mean "set beyond anything the hardware can
  # reach", which moves the binding constraint from a number I picked to
  # the machines themselves.
  #
  # Where the hardware actually binds: app pods can only land on the five
  # untainted workers (cn9 4, icf 4, k27 32, o06 4, u4h 20 = 64 cores);
  # the three control planes and loadgen are all NoSchedule. The target
  # below is 500m average per pod, so 64 cores is reached at about 128
  # pods. 200 is comfortably past that, so the cluster runs out of CPU
  # before this number is ever consulted.
  #
  # 40 was the previous value and it was my guess, not a measurement.
  # It would have stopped the fleet at roughly a third of what the nodes
  # can hold and reported that as the system's limit.
  #
  # One consequence worth recording, because it is not obvious: with no
  # resource requests anywhere, the scheduler has no basis on which to
  # refuse a pod, so it will keep placing them even past the point where
  # the nodes can feed them. The expectation is that the fleet settles
  # well below that and serves the traffic; but if a component turns out
  # to be unable to cope on these terms, the answer is to replace that
  # component rather than to put the fence back.
  maxReplicas: 40
  # AverageValue, not Utilization.
  #
  # Utilization is a percentage OF THE REQUEST, so with no requests set
  # it has nothing to divide by and the HPA reports <unknown> forever
  # and never scales. An absolute target needs no reservation: scale out
  # whenever the average pod is burning more than half a core.
  #
  # 500m was measured -- pods drew ~540m each under a 400-arrivals/sec
  # run -- so this fires at roughly the load that preceded trouble,
  # rather than at an arbitrary fraction of a number nobody reserved.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 500m
  behavior:
    # Asymmetric on purpose. Scaling up late costs users their page;
    # scaling down late costs a few idle pods. So: react immediately and
    # aggressively upward, and retreat slowly.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 8
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Five minutes of calm before giving anything back, so a lull
      # between spikes does not strip the capacity the next one needs.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
