# Grafana, reachable on the LAN via MetalLB.
#
# The admin password lives in a Secret created out-of-band (see the
# README next to this file) rather than being committed here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          # Deliberately not under /var/lib/grafana -- that path is the
          # PVC mount, and nesting a ConfigMap mount inside it is a
          # fragile arrangement that can shadow the volume.
          path: /etc/grafana/dashboards
---
# One purpose-built dashboard rather than a generic import. The panel
# order is the order the 2026-10-13 investigation actually needed:
# throttling first (it was the answer twice and is invisible in
# `kubectl top`), then CPU against its limit, then what visitors
# experienced, then the backing services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-capacity
  namespace: monitoring
data:
  # A second dashboard in the same ConfigMap. The file provider reads
  # every file in /etc/grafana/dashboards, so this needs no change to the
  # Deployment and no restart -- Grafana polls the directory and the
  # kubelet refreshes a mounted ConfigMap within about a minute.
  #
  # Separate from capacity.json on purpose: that one answers "what is the
  # cluster doing", this one answers "what did this load test find", and
  # they are read at different times by different questions.
  journey-load-test.json: |
    {
      "title": "Load test: journey run",
      "uid": "journey",
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-45m",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Generators reporting (no fixed target -- the rig is scaled by replica count)",
          "description": "Should be 12. Fewer means one was killed -- above 216 arrivals/sec expect exactly that, and it is the rig failing, not the site. Metrics already pushed are safe either way.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 1
                  },
                  {
                    "color": "#0ca30c",
                    "value": 2
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "count(count by (gen) (k6_vus))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Sessions completed /sec",
          "description": "Compare against the step being held: 48, 90, 132, 174, 216, 258, 300. Where this stops tracking the offered rate, something has run out.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(rate(k6_iterations_total[1m]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Sessions dropped /sec",
          "description": "k6 abandoning scheduled work because it has no VU free. Sustained above zero means the offered rate is not actually being applied.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 0.5
                  },
                  {
                    "color": "#d03b3b",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(k6_dropped_iterations_total[1m])) or vector(0))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Requests failing",
          "description": "Note what the 2026-10-15 run found: requests SUCCEEDED while taking ten seconds. A flat line here is not evidence of health -- read the latency panel for that.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 0.01
                  },
                  {
                    "color": "#d03b3b",
                    "value": 0.05
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(k6_http_reqs_total{expected_response=\"false\"}[1m])) or vector(0)) / clamp_min(sum(rate(k6_http_reqs_total[1m])), 0.001)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency by journey step, all generators together",
          "description": "The twelve generators push native histograms, which are additive -- so summing them and then taking the quantile is the real site-wide p95, not an average of twelve separate p95s (which would mean nothing). The home page is the one to watch: on 2026-10-15 it was bimodal, 140ms median against a 10.79s p95, because publishing an ad flushes the whole page cache and every request in the next three seconds regenerates it.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "home"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "listings index"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "listing detail"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "search"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(k6_step_home_seconds[1m])))",
              "legendFormat": "home"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(k6_step_listings_index_seconds[1m])))",
              "legendFormat": "listings index"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(k6_step_listing_detail_seconds[1m])))",
              "legendFormat": "listing detail"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(k6_step_search_seconds[1m])))",
              "legendFormat": "search"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Sessions per second: offered, completed, dropped",
          "description": "All three in the same unit on one axis, deliberately. Offered is what the staircase asked for (completed + dropped, since k6 drops what it cannot start). When completed falls away from offered, read the generator memory panel before blaming the site.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "offered"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "completed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "dropped"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(k6_iterations_total[1m])) + (sum(rate(k6_dropped_iterations_total[1m])) or vector(0))",
              "legendFormat": "offered"
            },
            {
              "expr": "sum(rate(k6_iterations_total[1m]))",
              "legendFormat": "completed"
            },
            {
              "expr": "(sum(rate(k6_dropped_iterations_total[1m])) or vector(0))",
              "legendFormat": "dropped"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Home page p95 by staircase step  (this is the knee)",
          "description": "One bar per held step, which is the whole reason the run is tagged: the 2026-10-15 run could only say the knee was 'somewhere between 48 and 192 arrivals/sec'. Steps are labelled s<n>_<site-wide arrivals/sec>. `ramp` is the transitions and belongs to no step; `tail` is the write personas outliving the staircase. Use a run-length time range for this one.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#3987e5"
              },
              "custom": {
                "fillOpacity": 85,
                "lineWidth": 0,
                "axisLabel": "p95"
              }
            }
          },
          "options": {
            "xTickLabelRotation": 0,
            "showValue": "always",
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (stair) (rate(k6_step_home_seconds[$__range])))",
              "legendFormat": "{{stair}}",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Generator memory  (the rig's own ceiling, ~13.5 GB usable)",
          "description": "The honest test of who is slow. Latency rising while this climbs towards the line is the GENERATOR stalling -- k6 starts its request timer when a request is queued, so its own memory pressure is recorded as server latency. Latency rising while this is flat is the site. A visitor costs 2.12 MB here, which is why 300 arrivals/sec is past what 16 GB can generate.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#199e70"
              },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "#d03b3b",
                    "value": 14495514624
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"laravel-spa\",pod=~\"k6-(journey|soak).*\"})",
              "legendFormat": "all generators"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "App replicas during the run  (and why this panel is a trap)",
          "description": "On 2026-10-15 the home page's p95 reached 10.79s while this sat at 24 for the entire run. Both HPAs scale on CPU, and CPU-based autoscaling is structurally blind to an I/O stall: the pods were waiting on Redis, not burning CPU, so the autoscaler saw an idle fleet and correctly concluded nothing was needed. Judge the run by latency; this panel only says whether scaling was even attempted.\n\nNote exported_namespace, not namespace: the pod scrape overwrites the namespace label with kube-state-metrics' own.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "app-clone: current"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "app-clone: ceiling"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "traefik: current"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{exported_namespace=\"laravel-spa\"}",
              "legendFormat": "app-clone: current"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{exported_namespace=\"laravel-spa\"}",
              "legendFormat": "app-clone: ceiling"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{exported_namespace=\"traefik-system\"}",
              "legendFormat": "traefik: current"
            }
          ]
        }
      ]
    }
  capacity.json: |
    {
      "title": "Capacity & Bottlenecks",
      "uid": "capacity",
      "timezone": "browser",
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU throttling % by pod  (>0 means frozen against its limit)",
          "description": "The metric that found both the Redis and app-tier bottlenecks. A throttled container reports LOW cpu usage while being stalled, so it is invisible in kubectl top. Anything sustained above ~5% is costing latency.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "custom": { "fillOpacity": 10 } }
          },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container!=\"\"}[5m])) / clamp_min(sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container!=\"\"}[5m])), 1)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU used vs limit, by workload",
          "description": "Solid lines are usage, the limit is the ceiling they cannot cross. Usage flat against a limit while latency climbs is throttling, not saturation.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",namespace=~\"laravel-spa|monitoring|traefik-system\"}[5m]))",
              "legendFormat": "{{namespace}} used"
            },
            {
              "expr": "sum by (namespace) (container_spec_cpu_quota{container!=\"\",namespace=~\"laravel-spa|monitoring|traefik-system\"} / container_spec_cpu_period)",
              "legendFormat": "{{namespace}} LIMIT"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Node CPU busy %",
          "description": "Per-node host CPU from node-exporter. The database box at .111 is NOT here - it is outside the cluster with only 3306 reachable.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [
            {
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "expr": "sum by (service) (rate(traefik_service_requests_total[5m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request duration p95  (what a visitor waits)",
          "description": "The number that went from 60s to 8.67s on 2026-10-13. Watch this during a load test, not the average - the average hides a collapsing tail.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95 {{service}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP 5xx rate",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 26 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "expr": "sum by (code) (rate(traefik_service_requests_total{code=~\"5..\"}[5m]))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Redis: ops/sec and connected clients",
          "description": "Clients tracks pm.max_children x replicas - it reached 3,214 under load, one per PHP-FPM worker.",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 26 },
          "fieldConfig": { "defaults": { "min": 0 } },
          "targets": [
            { "expr": "rate(redis_commands_processed_total[5m])", "legendFormat": "ops/sec" },
            { "expr": "redis_connected_clients", "legendFormat": "connected clients" }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  # A PVC's `storage` request is the SIZE OF THE DISK, not a reservation of
  # anything shared -- so the no-requests-no-limits policy (which is about
  # CPU and memory) does not apply to it. Omitting it does not mean
  # "uncapped"; it means the manifest is rejected outright:
  #
  #   spec.resources.requests.storage: Forbidden: field can not be less
  #   than status.capacity
  #
  # which is why this whole file silently would not apply. The live volume
  # is 2Gi. Same correction as in 10-prometheus.yaml.
  resources:
    requests:
      storage: 2Gi
  # The policy note below is kept because it is still true of this
  # Deployment's containers, which have neither requests nor limits.
  # No requests, no limits -- by policy.
  #
  # A request RESERVES capacity whether or not it is used, and the
  # scheduler places pods on reservations rather than reality. That is
  # what made this cluster look 79% full while it was 35% used, so
  # nothing could be placed and "least loaded node" was decided from
  # fiction. A limit is a ceiling that has to be guessed in advance,
  # and every guess made here was wrong for the next traffic shape --
  # it OOMKilled the ingress twice.
  #
  # So: nothing is reserved and nothing is capped. Every pod may take
  # whatever the node has free, and scaling decisions belong to
  # Kubernetes (see the HorizontalPodAutoscalers) rather than to
  # hand-picked numbers.
  #
  # The accepted trade-off: with no requests every pod is BestEffort
  # QoS, so under genuine node memory pressure the kubelet evicts
  # these first and the kernel may OOM-kill them. That is deliberate.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            # No anonymous access: this is reachable on the LAN.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-capacity
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # Traefik already holds .200 from the same MetalLB pool
    # (192.168.100.200-210); pin this so the bookmark never moves.
    metallb.universe.tf/loadBalancerIPs: 192.168.100.201
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
