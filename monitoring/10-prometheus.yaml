# Prometheus for the Talos cluster.
#
# Written 2026-10-13 after a capacity investigation where the absence of
# this cost hours. Two of the three bottlenecks found that day were
# cgroup CPU throttling (Redis capped at 250m, then the app tier at 2
# cores), which is invisible in `kubectl top` -- a throttled container
# reports LOW cpu usage while being completely stalled, so the cluster
# looked 95% idle while the site collapsed. The metric that exposes it,
# container_cpu_cfs_throttled_periods_total, comes from cAdvisor and is
# scraped below. Had this existed, the diagnosis would have been minutes.
#
# metrics-server (already installed) is NOT a substitute: it keeps a ~15
# second rolling window with no history, and exposes neither throttling
# nor anything about MySQL, Redis or Traefik.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Talos enforces PodSecurity "baseline" cluster-wide by default, and
    # that default does not show up in a namespace's own labels -- so an
    # unlabelled namespace looks unrestricted but is not. node-exporter
    # needs hostNetwork, hostPID, hostPath and hostPort, all of which
    # baseline forbids, so this namespace has to opt out explicitly.
    # longhorn-system and metallb-system carry the same label for the
    # same reason; this follows that established pattern.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Read-only cluster access, used for service discovery and for proxying
# kubelet/cAdvisor scrapes through the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      # 15s is frequent enough to catch a throttling spike inside a
      # single load-test plateau. The ramps used here hold each level
      # for two minutes, so this gives ~8 samples per plateau.
      scrape_interval: 15s
      evaluation_interval: 15s

    # ALERT RULES, added 2026-10-19 before going live.
    #
    # Mounted from the same ConfigMap, so `kubectl apply` of this file
    # ships the rules with the config that loads them.
    #
    # A NOTE ON DELIVERY, so nobody assumes more than exists: these rules
    # make Prometheus mark conditions as firing, which is visible in its
    # own UI, on the Live site dashboard's alert panel, and queryable as
    # ALERTS{}. They do NOT send anything. Email or SMS needs a contact
    # point with credentials -- see the Active alerts panel note.
    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      # ---- cAdvisor: per-container CPU, memory, and THROTTLING ----
      # Scraped via the API server proxy rather than hitting kubelet
      # directly on :10250 -- Talos locks the kubelet down, and the
      # proxy route needs only the RBAC granted above.
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ---- kubelet's own metrics (node-level, volume stats) ----
      - job_name: kubernetes-kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # ---- anything that opts in with an annotation ----
      # Exporters added later (node-exporter, redis, mysqld) just carry
      # prometheus.io/scrape: "true" and are picked up automatically,
      # so this config does not need editing for each one.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ---- Traefik: request rates, latencies, status codes ----
      # Already enabled on the deployment (--metrics.prometheus=true on
      # a dedicated :9100 entrypoint), so this just points at it.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [traefik-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: traefik
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9100
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ---- CoreDNS ----
      # Added after DNS turned out to be a per-request wait hiding
      # inside every page load: ndots:5 expansion meant 8 queries per
      # Redis connection, CoreDNS had served 79 million queries per pod
      # and was burning 2.26 cores, and one replica averaged 8.07ms per
      # query against 0.41ms on its sibling. None of that was visible
      # until it was looked for by hand.
      #
      # Watch coredns_dns_requests_total (volume) against
      # coredns_dns_request_duration_seconds_sum/_count (mean latency);
      # a healthy cluster record resolves well under 1ms.
      - job_name: coredns
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: kube-dns
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9153
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  alerts.yml: |
    groups:
      - name: site
        interval: 30s
        rules:
          # THE ONE THAT MATTERS MOST.
          #
          # This project measured a 10.79s home p95 while the CPU-based
          # HPA sat idle and every other metric looked healthy, because
          # the pods were waiting on I/O rather than computing. Latency
          # is the only signal that moves during that, which is why it is
          # first and why "HPA at max" is not a substitute.
          #
          # 1s against a measured normal of 0.090s: twelve times normal,
          # not a hair trigger.
          - alert: SiteLatencyHigh
            expr: >
              histogram_quantile(0.95, sum by (le) (rate(
                traefik_service_request_duration_seconds_bucket{service=~"laravel-spa-laravel-spa-https-.*"}[5m]
              ))) > 1
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Site p95 latency {{ $value | humanizeDuration }} (normal is 0.090s)"
              runbook: "Check Live site dashboard. If app CPU is low and latency is high it is an I/O stall, not load -- look at mysql threads_running and Dragonfly before adding pods."

          - alert: SiteErrorsHigh
            expr: >
              (sum(rate(traefik_service_requests_total{service=~"laravel-spa-laravel-spa-https-.*",code=~"5.."}[5m])) or vector(0))
              / clamp_min(sum(rate(traefik_service_requests_total{service=~"laravel-spa-laravel-spa-https-.*"}[5m])), 0.001) > 0.02
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $value | humanizePercentage }} of requests returning 5xx"

          # Not "something is wrong" -- "the fleet has run out of room".
          # With the capacity-testing era over, this is the signal that
          # decides when to add equipment.
          - alert: AppFleetAtCeiling
            expr: >
              kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="laravel-spa-app"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="laravel-spa-app"}
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "App fleet has been at its {{ $value }}-replica ceiling for 15 minutes"
              runbook: "Raise maxReplicas if the untainted workers have cores free; add a worker if they do not."

          # 24 cores means roughly 24 concurrent queries before they
          # start contending. Measured normal is 2-6.
          - alert: DatabaseConcurrencyHigh
            expr: mysql_global_status_threads_running > 16
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "MySQL running {{ $value }} concurrent queries (normal is 2-6, ~24 cores available)"

          - alert: DatabaseUnreachable
            expr: mysql_up == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "The database at 192.168.100.111 is not answering the exporter"

          - alert: AppPodsUnavailable
            expr: >
              kube_deployment_status_replicas_available{deployment="laravel-spa-app"}
              < kube_deployment_spec_replicas{deployment="laravel-spa-app"} * 0.75
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "Only {{ $value }} app pods available of the desired count"

      - name: infrastructure
        interval: 60s
        rules:
          # cert-manager renews automatically; this fires when it has not.
          - alert: TLSCertificateExpiringSoon
            expr: min(traefik_tls_certs_not_after - time()) / 86400 < 14
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "A TLS certificate expires in {{ $value | printf \"%.0f\" }} days and has not renewed"

          # Prometheus holds the only record of what happened. It filling
          # up ends the record, which is how three days of soak data was
          # nearly lost before a size cap was added.
          - alert: PrometheusDiskFilling
            expr: >
              prometheus_tsdb_storage_blocks_bytes / 1024 / 1024 / 1024 > 7
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "Prometheus is holding {{ $value | printf \"%.1f\" }} GiB against a 9.7 GiB volume and an 8 GiB retention cap"

          - alert: NodeMemoryLow
            expr: >
              node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} memory available"
              runbook: "loadgen reaching this is what killed its kubelet on 2026-10-19 and stranded 13 pods."

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  # THE ONE REQUEST IN THIS REPOSITORY, AND WHY IT IS NOT AN EXCEPTION.
  #
  # The no-requests-no-limits policy is about CPU and memory, where a
  # request reserves a share of a node whether or not it is used -- which
  # is what made this cluster look 79% full while it was 35% used.
  #
  # A PersistentVolumeClaim's `storage` request is a different thing
  # wearing the same word: it is the SIZE OF THE DISK to create, not a
  # claim on anything shared. Longhorn has nothing to provision without
  # it, and because a bound PVC's size cannot be reduced, a manifest that
  # omits it does not express "uncapped" -- it is simply rejected:
  #
  #   spec.resources.requests.storage: Forbidden: field can not be less
  #   than status.capacity
  #
  # So the whole file failed to apply, silently, until something needed
  # changing in it. The live volume is 10Gi; this records that rather
  # than contradicting it.
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    # The PVC is ReadWriteOnce, so the old pod must release it before
    # the new one can mount it. A rolling update would deadlock.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # The official image runs as nobody; Longhorn volumes come up
        # root-owned, so hand the data dir to that uid.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            # SIZE CAP AS A BACKSTOP, added 2026-10-16 before an
            # unattended multi-day soak.
            #
            # Time-based retention alone does not protect the disk: if the
            # volume fills before 15 days elapse, Prometheus stops
            # ingesting and the run's data stops at that moment -- which
            # is precisely the data the run exists to produce. At 12
            # generators it writes ~1.1 GB/day against a 9.7 GB volume;
            # at 20 it is closer to 1.7 GB/day, and a long weekend plus
            # the existing 3.1 GB gets close enough to matter.
            #
            # 8GB leaves headroom on the volume and makes Prometheus drop
            # the OLDEST blocks rather than die. Losing last week is
            # recoverable; losing this weekend is not.
            - --storage.tsdb.retention.size=8GB
            - --web.enable-lifecycle
            # PUSH, not scrape, and only for the load generators.
            #
            # Everything else here is scraped, which is the right default:
            # a target that dies stops answering, and its absence is
            # itself the signal. A load generator is the one thing that
            # cannot work that way. It lives for twenty-five minutes, it
            # is EXPECTED to be killed at the top of a staircase, and its
            # results existed only inside its own process -- so when the
            # 2026-10-15 run's generators went, the run's numbers went
            # with them.
            #
            # k6 pushes every 5 seconds, so a generator that dies now
            # loses at most five seconds and every step below the break
            # survives in here.
            #
            # The endpoint (/api/v1/write) accepts anything that can reach
            # it, which is why the Service stays ClusterIP: in-cluster
            # only, viewed through Grafana, which has a login. Do not give
            # this a LoadBalancer address without putting auth in front.
            - --web.enable-remote-write-receiver
            # Native histograms, which is what makes twelve generators'
            # latencies ADDABLE. A p95 reported per generator cannot be
            # averaged across twelve of them -- that is why the merge
            # script settles for the median of twelve estimates. A
            # histogram is additive by construction, so summing the twelve
            # and then taking the quantile is the real figure rather than
            # an approximation of it.
            - --enable-feature=native-histograms
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
