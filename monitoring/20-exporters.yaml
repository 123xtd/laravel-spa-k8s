# Exporters feeding the Prometheus in 10-prometheus.yaml.
#
# Both carry prometheus.io/scrape annotations and are picked up by the
# kubernetes-pods job automatically -- no scrape config edit needed.
---
# node-exporter: per-node host CPU (including per-core), memory, disk,
# network and -- importantly -- swap. During the capacity work the only
# way to see a node's real CPU was to read `top` off a screen, and the
# database box could not be seen at all.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      # Host namespaces so the exporter reports the node's figures
      # rather than its own container's.
      hostNetwork: true
      hostPID: true
      # Run everywhere, control planes included -- two of the three
      # control planes are also carrying real workload.
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            # Talos mounts a lot of read-only pseudo-filesystems that
            # are noise in disk metrics.
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|host/root/var/lib/kubelet/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
            # 9100 is taken by Traefik's metrics entrypoint, and
            # hostNetwork means we share the node's port space.
            - --web.listen-address=:9101
          ports:
            - name: metrics
              containerPort: 9101
              hostPort: 9101
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
# redis-exporter: Redis was the first bottleneck found (capped at 250m
# and frozen 22% of wall clock). This surfaces the symptoms directly --
# connected clients, ops/sec, blocked clients, keyspace hit ratio --
# alongside the cgroup throttling that cAdvisor already provides.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.67.0
          env:
            - name: REDIS_ADDR
              value: redis://redis.laravel-spa.svc.cluster.local:6379
          ports:
            - name: metrics
              containerPort: 9121
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.