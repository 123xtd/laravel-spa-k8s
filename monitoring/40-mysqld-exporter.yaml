# mysqld-exporter for the database box at 192.168.100.111.
#
# That machine is outside the cluster and exposes ONLY port 3306 -- no
# SSH, no node-exporter. So this is the only remote visibility into it,
# and it is worth being clear about the limit: it reports what MySQL
# knows about itself (queries/sec, rows read, connections, InnoDB state,
# lock waits) but NOT the host's CPU, load average or swap. Those still
# have to be read off a screen on the box itself, which is how the
# 2026-10-13 investigation had to do it.
#
# Requires a Secret this manifest does not contain:
#
#   kubectl create secret generic mysqld-exporter -n monitoring \
#     --from-literal=password='<the laravel DB password>'
#
# PROCESS was believed to have been granted to `laravel` on 2026-10-13.
# It was NOT: first run of this exporter on 2026-10-15 was refused with
# "you need (at least one of) the PROCESS privilege(s)". The engine-state
# scraper is disabled below as a result, and `SHOW ENGINE INNODB STATUS`
# plus `information_schema.processlist` remain unavailable -- the latter
# shows only the exporter's own connection, which reads as an idle
# server. Everything in global_status/global_variables works, which is
# where the metrics that matter live (queries/sec, rows read,
# threads_running, connections).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqld-exporter
  template:
    metadata:
      labels:
        app: mysqld-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
    spec:
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.16.0
          args:
            - --mysqld.address=192.168.100.111:3306
            - --mysqld.username=laravel
            # Rows read per second was the metric that exposed the
            # missing index (1.84 million rows/sec off 1,011 queries).
            # It lives in the global status collector, on by default.
            - --collect.global_status
            - --collect.global_variables
            - --collect.info_schema.innodb_metrics
            # engine_innodb_status and slave_status are OFF, and both for
            # the same reason: the `laravel` user does not have the
            # privilege, so each one issued a query that was refused on
            # every scrape -- an error line every 15 seconds and a
            # pointless round trip to the database box.
            #
            #   engine_innodb_status  needs PROCESS
            #   slave_status          needs REPLICATION CLIENT (or SUPER)
            #
            # slave_status is simply not applicable -- there is no
            # replica. engine_innodb_status IS worth having (buffer pool
            # and lock detail during a stall), so to re-enable it:
            #
            #   GRANT PROCESS ON *.* TO 'laravel'@'%';
            #
            # then drop the --no-collect line below and restore
            # --collect.engine_innodb_status.
            - --no-collect.slave_status
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysqld-exporter
                  key: password
          ports:
            - name: metrics
              containerPort: 9104
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.