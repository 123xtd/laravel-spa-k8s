apiVersion: batch/v1
kind: CronJob
metadata:
  name: yard-sales-prune-ended
  namespace: laravel-spa
spec:
  schedule: "0 3 * * *"
  # Central Time, not UTC — 3am here is 4am Eastern / 1am Pacific. The
  # cluster (k8s 1.36) handles CST/CDT automatically, no manual
  # UTC-offset math.
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: prune-ended-yard-sales
              image: ghcr.io/123xtd/laravel-spa-app:latest
              command: ["php", "artisan", "yard-sales:prune-ended"]
              workingDir: /var/www/html
              envFrom:
                - secretRef:
                    name: laravel-spa-secrets
              # Capped, matching what the cluster has actually been
              # running. `kubectl apply` does not clear a field a
              # manifest omits, so these values survived in the live
              # CronJob long after the file stopped naming them -- the
              # trap worth remembering (same as `args: []` in
              # redis.yaml). The earlier fix wrote `resources: {}` to
              # make the file honest, but that resolves the mismatch by
              # DELETING the cap instead of recording it.
              #
              # Recording it is the better half of that trade. Measured
              # 2026-10-21: three consecutive runs completed exit 0 at
              # these limits, and yard_sales currently holds 0 rows, so
              # the cap costs nothing.
              #
              # The note that used to live here argued a 250m cap would
              # make a 98,212-row backlog crawl. That was about
              # listings:prune-expired -- a different command, in a
              # different job -- and the backlog is gone regardless:
              # the synthetic purge left 2 listings.
              #
              # If this job ever gets slow, raise the number here and
              # apply, rather than removing the cap. Note the command
              # does YardSale::all(), so memory scales with row count.
              resources:
                limits:
                  cpu: 250m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 82
                runAsGroup: 82
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              # No requests, no limits -- by policy.
              #
              # A request RESERVES capacity whether or not it is used, and the
              # scheduler places pods on reservations rather than reality. That is
              # what made this cluster look 79% full while it was 35% used, so
              # nothing could be placed and "least loaded node" was decided from
              # fiction. A limit is a ceiling that has to be guessed in advance,
              # and every guess made here was wrong for the next traffic shape --
              # it OOMKilled the ingress twice.
              #
              # So: nothing is reserved and nothing is capped. Every pod may take
              # whatever the node has free, and scaling decisions belong to
              # Kubernetes (see the HorizontalPodAutoscalers) rather than to
              # hand-picked numbers.
              #
              # The accepted trade-off: with no requests every pod is BestEffort
              # QoS, so under genuine node memory pressure the kubelet evicts
              # these first and the kernel may OOM-kill them. That is deliberate.