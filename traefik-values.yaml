# Helm values for the Traefik release (chart traefik-41.3.0, namespace
# traefik-system). Apply with:
#
#   helm upgrade traefik traefik/traefik -n traefik-system \
#     --version 41.3.0 -f k8s/traefik-values.yaml
#
# Anything set via `kubectl scale`/`kubectl edit` instead is silently
# reverted by the next helm upgrade.
#
# ---------------------------------------------------------------------
# NO REQUESTS, NO LIMITS -- by policy.
#
# A REQUEST is a reservation: it is guaranteed, it decides scheduling,
# and it sets the pod's cgroup CPU weight. A LIMIT is a cap: it costs
# nothing until it is used, and it exists to stop a runaway process
# taking a node down.
#
# This file previously got that backwards, twice, and took the ingress
# offline both times. `limits.memory: 1Gi` was set from an idle reading
# of 110-170Mi, which looked generous and was actually below the working
# set -- all three pods OOMKilled five times under load. Raised to 3Gi
# from a journey-test peak of 2,751Mi, which then OOMKilled again under a
# 40,000-arrival burst, because burst memory is a completely different
# profile: Traefik buffers per in-flight response, and the page is
# ~610 KB.
#
# The lesson is not "find a better number". It is that a limit derived
# from any single observation will be wrong for the next traffic shape.
# So there are none: Traefik takes whatever the node has free, and load
# is absorbed by HORIZONTAL scaling, which Kubernetes decides.
#
# Accepted trade-off: with no request the ingress is BestEffort QoS,
# which is what made it CPU-starved under contention before. Scaling out
# is the mitigation -- more pods competing for their own share -- rather
# than a reserved slice.
# ---------------------------------------------------------------------

deployment:
  # The floor. autoscaling below raises it on demand; this is what runs
  # when the site is quiet.
  replicas: 3

# Scale the ingress out under load instead of expecting one hand-picked
# memory ceiling to cover every traffic shape.
#
# More pods is the right answer for Traefik specifically: its memory is
# dominated by per-connection buffers, so spreading the same connections
# over more pods reduces the memory each one needs. Vertical headroom
# alone cannot do that.
#
# CPU is the trigger rather than memory because it is the leading
# indicator: CPU rises as the work arrives, whereas memory rises after
# it has already been accepted and buffered. By the time memory moves,
# the latency has happened.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  # AverageValue rather than Utilization: utilisation is a percentage of
  # the REQUEST, and nothing is reserved any more, so a percentage has
  # no denominator and the HPA would never fire. Absolute target: add
  # pods whenever the average one is burning more than a core.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: "1"


additionalArguments:
  # Default is 200: past that, Traefik stops reusing keep-alive
  # connections to the backend and opens a fresh one per request, which
  # is expensive under load. This is a ceiling, not a pre-allocation —
  # idle connections only exist once they've been opened, so a high value
  # costs nothing until it's actually used.
  - "--serverstransport.maxidleconnsperhost=10000"
