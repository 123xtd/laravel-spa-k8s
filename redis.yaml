apiVersion: v1
kind: Namespace
metadata:
  name: laravel-spa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: laravel-spa
spec:
  # ZERO, not deleted. Dragonfly replaced this on 2026-10-15 (see
  # dragonfly.yaml for why). The Deployment is kept at zero so rollback
  # is `replicas: 1` plus pointing the Service selector below back at
  # `app: redis` -- no manifest archaeology at the moment it is needed.
  #
  # Deleting this block is the right move once Dragonfly has held a full
  # soak without incident.
  replicas: 0
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Declared here rather than set with CONFIG SET at runtime.
          #
          # This file had drifted: it still said 250m/256Mi while the live
          # deployment ran 4 cores/1Gi from a kubectl edit, and the memory
          # settings lived only in the pod's `args`. Declaring them here
          # means the manifest is now the whole truth.
          #
          # NO MEMORY CAP. `--maxmemory 0` means unlimited, by explicit
          # instruction: nothing in this cluster is capped, and if a
          # component cannot work on those terms it gets replaced rather
          # than fenced.
          #
          # What this changes, so it is not a surprise later. Redis
          # previously ran with maxmemory 8gb and allkeys-lru, which made
          # memory pressure a GRADUAL failure: the coldest cached pages
          # were evicted and the site kept serving from a smaller cache
          # (259,425 keys were evicted in one run, invisibly to users).
          # Uncapped, there is nothing to evict against, so pressure
          # becomes an ABRUPT failure -- Redis grows until the kernel
          # OOM-kills it on k27 and the entire cache disappears at once,
          # along with every session held in it.
          #
          # How much room that is: at 160 arrivals/sec Redis held 762 MB,
          # and only 23 MB of that was data -- 739 MB was per-client I/O
          # buffers for a 640 KB page value served to 9,160 clients
          # concurrently. There were 468 actual keys. So consumption
          # tracks CONCURRENT CLIENTS, not stored data, and it scales
          # with arrival rate. k27 has 32 GB, which at that ratio is
          # roughly 6,700 arrivals/sec before the node is gone.
          #
          # allkeys-lru is retained deliberately even though maxmemory is
          # 0. The policy is inert at 0, but it means that if a memory
          # cap is ever reintroduced the behaviour returns to eviction
          # rather than to refusing writes.
          #
          # maxclients is likewise raised past any practical limit. The
          # real ceiling becomes the process file-descriptor limit, which
          # is the kernel's number rather than one chosen here.
          #
          # Snapshots stay off: a fork at this size transiently doubles
          # RSS, which with no cap is now the fastest route to OOM.
          # Nothing here needs to survive a restart.
          command:
            - redis-server
            - --maxmemory
            - "0"
            - --maxmemory-policy
            - allkeys-lru
            - --maxclients
            - "1000000"
            - --save
            - ""
            - --appendonly
            - "no"
          # Explicitly empty, and load-bearing.
          #
          # Kubernetes appends `args` AFTER `command`, and when two Redis
          # flags conflict the LAST one wins. A previous kubectl edit had
          # left args=[--maxclients 20000 --maxmemory 768mb] on this pod,
          # and because `apply` does not touch fields a manifest omits,
          # those stale values silently overrode every flag above --
          # maxmemory read back as 768mb from a pod whose own command line
          # said otherwise. Declaring it empty is what stops that recurring.
          args: []
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # No requests, no limits -- by policy.
          #
          # A request RESERVES capacity whether or not it is used, and the
          # scheduler places pods on reservations rather than reality. That is
          # what made this cluster look 79% full while it was 35% used, so
          # nothing could be placed and "least loaded node" was decided from
          # fiction. A limit is a ceiling that has to be guessed in advance,
          # and every guess made here was wrong for the next traffic shape --
          # it OOMKilled the ingress twice.
          #
          # So: nothing is reserved and nothing is capped. Every pod may take
          # whatever the node has free, and scaling decisions belong to
          # Kubernetes (see the HorizontalPodAutoscalers) rather than to
          # hand-picked numbers.
          #
          # The accepted trade-off: with no requests every pod is BestEffort
          # QoS, so under genuine node memory pressure the kubelet evicts
          # these first and the kernel may OOM-kill them. That is deliberate.
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: laravel-spa
spec:
  # STILL NAMED `redis`, NOW POINTING AT DRAGONFLY.
  #
  # 48 app pods carry REDIS_HOST=redis from the secret, so renaming this
  # Service would mean editing a secret and restarting the whole fleet to
  # gain nothing -- Dragonfly speaks the Redis protocol. This one
  # selector is the entire cutover, and flipping it back to `app: redis`
  # (plus replicas: 1 above) is the entire rollback. See dragonfly.yaml.
  selector:
    app: dragonfly
  ports:
    - port: 6379
      targetPort: 6379
